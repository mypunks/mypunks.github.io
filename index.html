<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mfer · ব্যাকগ্রাউন্ড #D8FF00</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 6px;
            font-size: 2.5rem;
            text-shadow: 0 0 20px #D8FF0066;
        }
        .sub {
            text-align: center;
            color: #aaa;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        .sub span {
            background: #D8FF00;
            color: #000;
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: bold;
        }
        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        .controls button {
            background: #D8FF00;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 0 20px #D8FF0044;
        }
        .controls button:hover {
            transform: scale(1.05);
            background: #fff;
            box-shadow: 0 0 40px #D8FF0088;
        }
        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== গ্যালারি ===== */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ===== NFT কার্ড (শুধু রিপ্লেস করা ইমেজ) ===== */
        .nft-card {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
            border: 2px solid #444;
            cursor: pointer;
        }
        .nft-card:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 35px rgba(216, 255, 0, 0.25);
            border-color: #D8FF00;
            z-index: 2;
        }
        .nft-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            background: #D8FF00; /* ফাইনাল ব্যাকগ্রাউন্ড */
        }
        .nft-card .token-id {
            color: #D8FF00;
            font-weight: bold;
            margin-top: 8px;
            font-size: 0.95rem;
            background: #1a1a1a;
            padding: 4px 12px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid #D8FF0033;
        }

        /* ===== মোডাল (512x512 ক্যানভাস) ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #1e1e1e;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 60px rgba(216, 255, 0, 0.25);
            border: 2px solid #D8FF00;
            max-width: 600px;
            width: 100%;
            position: relative;
        }
        .modal-content .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 2rem;
            color: #D8FF00;
            cursor: pointer;
            background: none;
            border: none;
            font-weight: bold;
            transition: transform 0.2s;
            line-height: 1;
        }
        .modal-content .close-btn:hover {
            transform: scale(1.3);
            color: #fff;
        }
        .modal-content .modal-title {
            color: #D8FF00;
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 512px;
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            background: #D8FF00;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #D8FF00;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3);
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            image-rendering: auto;
        }

        /* ===== স্ট্যাটাস বার ===== */
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0d0d0dcc;
            backdrop-filter: blur(6px);
            color: #aaa;
            padding: 10px 20px;
            text-align: center;
            font-size: 0.9rem;
            border-top: 1px solid #D8FF0044;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }
        .status-bar span {
            background: #222;
            padding: 2px 14px;
            border-radius: 30px;
        }
        .status-bar .highlight {
            color: #D8FF00;
            font-weight: bold;
        }
        .btn-reload {
            background: #D8FF00;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 4px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-reload:hover {
            background: #fff;
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .modal-content { padding: 16px; }
        }
    </style>
</head>
<body>

    <h1>🟢 mfer · #D8FF00</h1>
    <p class="sub">ব্যাকগ্রাউন্ড রিপ্লেস করা <span>১০,০০০</span> NFT</p>

    <div class="controls">
        <button id="downloadAllBtn" onclick="downloadAllAsZip()">📦 সব ছবি জিপে ডাউনলোড</button>
    </div>

    <div class="gallery" id="gallery"></div>

    <!-- ===== মোডাল ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeModalBtn">&times;</button>
            <div class="modal-title" id="modalTitle">#1234</div>
            <div class="canvas-wrapper">
                <canvas id="modalCanvas" width="512" height="512"></canvas>
            </div>
        </div>
    </div>

    <!-- ===== স্ট্যাটাস বার ===== -->
    <div class="status-bar" id="statusBar">
        <span id="loadedCount">০</span>
        <span id="totalCount">১০,০০০</span>
        <span id="statusMessage">প্রস্তুত হচ্ছে...</span>
        <button class="btn-reload" onclick="loadAllNFTs()">🔄 রিলোড</button>
    </div>

    <script>
        // ============================================================
        //  কনফিগারেশন
        // ============================================================
        const BASE_URL = 'https://ipfs.io/ipfs/QmWiQE65tmpYzcokCheQmng2DCM33DEhjXcPB6PanwpAZo';
        const TOTAL = 10000;
        const CONCURRENT_LIMIT = 30;
        const GATEWAY = 'https://ipfs.io/ipfs';
        const BG_COLOR = '#D8FF00';

        // ============================================================
        //  DOM রেফারেন্স
        // ============================================================
        const gallery = document.getElementById('gallery');
        const loadedSpan = document.getElementById('loadedCount');
        const totalSpan = document.getElementById('totalCount');
        const statusMsg = document.getElementById('statusMessage');
        const downloadBtn = document.getElementById('downloadAllBtn');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalCanvas = document.getElementById('modalCanvas');
        const modalTitle = document.getElementById('modalTitle');
        const closeModalBtn = document.getElementById('closeModalBtn');

        let loaded = 0;
        let failed = 0;
        let isRunning = false;
        let processedImages = []; // {tokenId, dataURL}

        // ============================================================
        //  মেটাডাটা থেকে CID বের করা
        // ============================================================
        function extractImageCid(metadata) {
            try {
                let data = typeof metadata === 'string' ? JSON.parse(metadata) : metadata;
                if (data.image) {
                    let img = data.image;
                    if (img.startsWith('ipfs://')) return img.replace('ipfs://', '');
                    if (img.startsWith('/ipfs/')) return img.replace('/ipfs/', '');
                    if (img.includes('ipfs.io/ipfs/')) {
                        return img.split('ipfs.io/ipfs/')[1]?.split('?')[0] || img;
                    }
                    return img;
                }
                if (data.image_data) return data.image_data;
                if (data.animation_url) return data.animation_url;
                for (let key of Object.keys(data)) {
                    let val = data[key];
                    if (typeof val === 'string' && (val.includes('ipfs://') || val.includes('/ipfs/'))) {
                        if (val.startsWith('ipfs://')) return val.replace('ipfs://', '');
                        if (val.startsWith('/ipfs/')) return val.replace('/ipfs/', '');
                        return val;
                    }
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        // ============================================================
        //  ব্যাকগ্রাউন্ড রিপ্লেস (ক্যানভাসে)
        // ============================================================
        function replaceBackground(imageUrl, tokenId) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                // ১. ব্যাকগ্রাউন্ড #D8FF00
                ctx.fillStyle = BG_COLOR;
                ctx.fillRect(0, 0, 512, 512);

                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = imageUrl;

                img.onload = function() {
                    // ২. ইমেজ ড্র
                    const imgAspect = img.width / img.height;
                    const canvasAspect = 1;
                    let drawW, drawH, offsetX, offsetY;
                    if (imgAspect > canvasAspect) {
                        drawH = 512;
                        drawW = 512 * imgAspect;
                        offsetX = (512 - drawW) / 2;
                        offsetY = 0;
                    } else {
                        drawW = 512;
                        drawH = 512 / imgAspect;
                        offsetX = 0;
                        offsetY = (512 - drawH) / 2;
                    }
                    ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

                    // ৩. ব্যাকগ্রাউন্ড রিপ্লেস (কর্নারের রঙ ধরে)
                    const imageData = ctx.getImageData(0, 0, 512, 512);
                    const data = imageData.data;
                    const r = data[0];
                    const g = data[1];
                    const b = data[2];
                    const tolerance = 30;

                    for (let i = 0; i < data.length; i += 4) {
                        const pr = data[i];
                        const pg = data[i+1];
                        const pb = data[i+2];
                        if (Math.abs(pr - r) < tolerance && Math.abs(pg - g) < tolerance && Math.abs(pb - b) < tolerance) {
                            data[i] = 216;
                            data[i+1] = 255;
                            data[i+2] = 0;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);

                    resolve(canvas.toDataURL('image/png'));
                };

                img.onerror = function() {
                    // যদি লোড না হয়, ব্যাকগ্রাউন্ড দেখাবে
                    ctx.fillStyle = BG_COLOR;
                    ctx.fillRect(0, 0, 512, 512);
                    ctx.fillStyle = '#00000088';
                    ctx.font = '20px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⚠️ Error', 256, 256);
                    resolve(canvas.toDataURL('image/png'));
                };
            });
        }

        // ============================================================
        //  NFT কার্ড তৈরি (শুধু রিপ্লেস করা ইমেজ)
        // ============================================================
        function createNFTCard(tokenId, dataURL) {
            const card = document.createElement('div');
            card.className = 'nft-card';
            card.dataset.tokenId = tokenId;

            const img = document.createElement('img');
            img.alt = `mfer #${tokenId}`;
            img.src = dataURL; // সরাসরি রিপ্লেস করা ইমেজ

            const idSpan = document.createElement('div');
            idSpan.className = 'token-id';
            idSpan.textContent = `#${tokenId}`;

            card.appendChild(img);
            card.appendChild(idSpan);

            // মোডাল খোলা
            card.addEventListener('click', function() {
                openModal(tokenId, dataURL);
            });

            return card;
        }

        // ============================================================
        //  মোডাল (রিপ্লেস করা ইমেজ দেখাবে)
        // ============================================================
        function openModal(tokenId, dataURL) {
            modalTitle.textContent = `#${tokenId}`;
            const canvas = modalCanvas;
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = function() {
                ctx.clearRect(0, 0, 512, 512);
                ctx.drawImage(img, 0, 0, 512, 512);
            };
            img.src = dataURL;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        //  ব্যাচ ফেচ + প্রসেস
        // ============================================================
        async function fetchBatch(start, end) {
            const promises = [];
            for (let i = start; i <= end && i <= TOTAL; i++) {
                const url = `${BASE_URL}/${i}`;
                promises.push(
                    fetch(url, { signal: AbortSignal.timeout(8000) })
                        .then(res => {
                            if (!res.ok) throw new Error(`HTTP ${res.status}`);
                            return res.text();
                        })
                        .then(text => ({ tokenId: i, text }))
                        .catch(err => ({ tokenId: i, error: err.message }))
                );
            }
            return Promise.all(promises);
        }

        // ============================================================
        //  সব NFT লোড করা (শুধু রিপ্লেস করা ছবি দেখাবে)
        // ============================================================
        async function loadAllNFTs() {
            if (isRunning) return;
            isRunning = true;
            gallery.innerHTML = '';
            loaded = 0;
            failed = 0;
            processedImages = [];
            downloadBtn.disabled = true;
            updateStatus('লোড শুরু হচ্ছে...', 0);

            let processed = 0;
            const batchSize = CONCURRENT_LIMIT;

            for (let start = 1; start <= TOTAL; start += batchSize) {
                const end = Math.min(start + batchSize - 1, TOTAL);
                const results = await fetchBatch(start, end);

                for (const res of results) {
                    let cid = null;
                    if (res.error) {
                        failed++;
                        cid = 'QmZ4tDuvesekSs4rMqS8Vj6Tj5Ht6pXH4s8b3JqW4kL1v2';
                    } else {
                        cid = extractImageCid(res.text);
                        if (!cid) {
                            failed++;
                            cid = 'QmZ4tDuvesekSs4rMqS8Vj6Tj5Ht6pXH4s8b3JqW4kL1v2';
                        }
                    }

                    // ব্যাকগ্রাউন্ড রিপ্লেস
                    const imageUrl = `${GATEWAY}/${cid}`;
                    const dataURL = await replaceBackground(imageUrl, res.tokenId);

                    // সংরক্ষণ
                    processedImages.push({ tokenId: res.tokenId, dataURL });

                    // কার্ড তৈরি
                    const card = createNFTCard(res.tokenId, dataURL);
                    gallery.appendChild(card);

                    loaded++;
                }

                processed += results.length;
                updateStatus(`প্রসেস করা হয়েছে ${processed} টি`, processed);
                await new Promise(r => setTimeout(r, 30));
            }

            updateStatus(`✅ সম্পন্ন! লোড: ${loaded}, ফেল: ${failed}`, loaded);
            downloadBtn.disabled = false;
            isRunning = false;
        }

        // ============================================================
        //  জিপ ডাউনলোড (সব রিপ্লেস করা ছবি)
        // ============================================================
        async function downloadAllAsZip() {
            if (processedImages.length === 0) {
                alert('কোনো ছবি প্রসেস করা হয়নি। দয়া করে প্রথমে লোড করুন।');
                return;
            }

            downloadBtn.disabled = true;
            downloadBtn.textContent = '⏳ জিপ তৈরি হচ্ছে...';

            try {
                const zip = new JSZip();
                const folder = zip.folder('mfer_bg_replaced');

                for (const item of processedImages) {
                    // dataURL থেকে ব্লব তৈরি
                    const response = await fetch(item.dataURL);
                    const blob = await response.blob();
                    folder.file(`mfer_${item.tokenId}.png`, blob);
                }

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                saveAs(zipBlob, 'mfer_10000_bg_replaced.zip');
            } catch (error) {
                console.error('জিপ তৈরি ব্যর্থ:', error);
                alert('জিপ তৈরি করতে সমস্যা হয়েছে। কনসোল চেক করুন।');
            }

            downloadBtn.disabled = false;
            downloadBtn.textContent = '📦 সব ছবি জিপে ডাউনলোড';
        }

        // ============================================================
        //  স্ট্যাটাস আপডেট
        // ============================================================
        function updateStatus(msg, count) {
            loadedSpan.textContent = count || loaded;
            totalSpan.textContent = TOTAL;
            statusMsg.textContent = msg;
        }

        // ============================================================
        //  শুরু
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            loadAllNFTs();
        });
    </script>
</body>
</html>
