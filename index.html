<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mfer · #D8FF00 Collection</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg: #0a0a0b;
            --bg-elevated: #131315;
            --card: #17171a;
            --card-border: #26262a;
            --lime: #D8FF00;
            --lime-dim: #D8FF0022;
            --text: #f2f2ef;
            --text-dim: #8f8f94;
            --error: #ff5470;
            --radius-lg: 20px;
            --radius-md: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse 1200px 700px at 50% -10%, #1c1f0c 0%, var(--bg) 55%), var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            padding: 48px 24px 96px;
            min-height: 100vh;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .brand .swatch {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            background: var(--lime);
            box-shadow: 0 0 18px var(--lime-dim), 0 0 4px var(--lime);
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            letter-spacing: -0.02em;
            text-align: center;
            color: var(--text);
        }

        h1 .hash { color: var(--lime); }

        .sub {
            text-align: center;
            color: var(--text-dim);
            margin-top: 10px;
            font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sub .count-pill {
            background: var(--bg-elevated);
            border: 1px solid var(--card-border);
            color: var(--lime);
            padding: 3px 12px;
            border-radius: 30px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 44px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            font-weight: 600;
            padding: 13px 28px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
            letter-spacing: 0.01em;
        }

        .btn-primary {
            background: var(--lime);
            color: #0a0a0b;
            box-shadow: 0 0 0 1px #D8FF0033, 0 8px 24px -6px #D8FF0055;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 0 1px #D8FF0055, 0 14px 30px -6px #D8FF0077;
        }
        .btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--card-border);
        }
        .btn-ghost:hover {
            border-color: var(--lime);
            color: var(--lime);
            transform: translateY(-2px);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .nft-card {
            background: var(--card);
            border-radius: var(--radius-md);
            padding: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            text-align: center;
            border: 1px solid var(--card-border);
            cursor: pointer;
            position: relative;
        }
        .nft-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px -12px rgba(216, 255, 0, 0.18);
            border-color: var(--lime);
            z-index: 2;
        }
        .nft-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            background: var(--lime);
        }
        .nft-card .token-id {
            color: var(--lime);
            font-weight: 600;
            margin-top: 8px;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-elevated);
            padding: 3px 10px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid #D8FF0022;
        }
        .nft-card .status-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--error);
            color: #fff;
            font-size: 0.62rem;
            font-weight: 600;
            padding: 2px 9px;
            border-radius: 20px;
            opacity: 0;
        }
        .nft-card .status-badge.show { opacity: 1; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(6, 6, 7, 0.9);
            backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--bg-elevated);
            border-radius: var(--radius-lg);
            padding: 22px;
            box-shadow: 0 0 80px rgba(216, 255, 0, 0.15);
            border: 1px solid var(--card-border);
            max-width: 560px;
            width: 100%;
            position: relative;
        }
        .modal-content .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 1.8rem;
            color: var(--text-dim);
            cursor: pointer;
            background: none;
            border: none;
            font-weight: 400;
            transition: transform 0.2s, color 0.2s;
            line-height: 1;
        }
        .modal-content .close-btn:hover {
            transform: scale(1.2);
            color: var(--lime);
        }
        .modal-content .modal-title {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--lime);
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 512px;
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            background: var(--lime);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--card-border);
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 11, 0.85);
            backdrop-filter: blur(10px);
            color: var(--text-dim);
            padding: 12px 24px;
            text-align: center;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            border-top: 1px solid var(--card-border);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .status-bar span {
            background: var(--bg-elevated);
            border: 1px solid var(--card-border);
            padding: 3px 14px;
            border-radius: 30px;
        }
        .status-bar .highlight { color: var(--lime); font-weight: 600; }

        @media (max-width: 1100px) {
            .gallery { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 800px) {
            .gallery { grid-template-columns: repeat(3, 1fr); gap: 12px; }
        }
        @media (max-width: 520px) {
            h1 { font-size: 1.9rem; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .modal-content { padding: 16px; }
        }
    </style>
</head>
<body>

    <div class="brand">
        <div class="swatch"></div>
        <h1>mfer <span class="hash">· #D8FF00</span></h1>
        <p class="sub">Fast-loading collection <span class="count-pill">10,000 NFTs</span></p>
    </div>

    <div class="controls">
        <button class="btn btn-primary" id="downloadAllBtn" onclick="downloadAllAsZip()">Download All as ZIP</button>
        <button class="btn btn-ghost" onclick="loadAllNFTs()">Reload Gallery</button>
    </div>

    <div class="gallery" id="gallery"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeModalBtn">&times;</button>
            <div class="modal-title" id="modalTitle">#1234</div>
            <div class="canvas-wrapper">
                <canvas id="modalCanvas" width="512" height="512"></canvas>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
        <span><span id="loadedCount" class="highlight">0</span> / <span id="totalCount">10,000</span></span>
        <span id="statusMessage">Preparing...</span>
        <span id="speedIndicator">🚀 0/sec</span>
    </div>

    <script>
        // ============================================================
        //  CONFIGURATION (Optimized)
        // ============================================================
        const BASE_URL = 'https://ipfs.io/ipfs/QmWiQE65tmpYzcokCheQmng2DCM33DEhjXcPB6PanwpAZo';
        const TOTAL = 10000;
        const CONCURRENT_LIMIT = 60; // increased for speed
        const GATEWAY = 'https://ipfs.io/ipfs';
        const BG_COLOR = '#D8FF00';
        const MAX_RETRY = 2;

        // ============================================================
        //  DOM REFERENCES
        // ============================================================
        const gallery = document.getElementById('gallery');
        const loadedSpan = document.getElementById('loadedCount');
        const totalSpan = document.getElementById('totalCount');
        const statusMsg = document.getElementById('statusMessage');
        const speedIndicator = document.getElementById('speedIndicator');
        const downloadBtn = document.getElementById('downloadAllBtn');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalCanvas = document.getElementById('modalCanvas');
        const modalTitle = document.getElementById('modalTitle');
        const closeModalBtn = document.getElementById('closeModalBtn');

        let loaded = 0;
        let failed = 0;
        let isRunning = false;
        let processedImages = [];
        let startTime = 0;
        let lastCount = 0;

        // ============================================================
        //  EXTRACT CID FROM METADATA (fast)
        // ============================================================
        function extractImageCid(metadata) {
            try {
                let data = typeof metadata === 'string' ? JSON.parse(metadata) : metadata;
                if (data.image) {
                    let img = data.image;
                    if (img.startsWith('ipfs://')) return img.replace('ipfs://', '');
                    if (img.startsWith('/ipfs/')) return img.replace('/ipfs/', '');
                    if (img.includes('ipfs.io/ipfs/')) {
                        return img.split('ipfs.io/ipfs/')[1]?.split('?')[0] || img;
                    }
                    return img;
                }
                if (data.image_data) return data.image_data;
                if (data.animation_url) return data.animation_url;
                for (let key of Object.keys(data)) {
                    let val = data[key];
                    if (typeof val === 'string' && (val.includes('ipfs://') || val.includes('/ipfs/'))) {
                        if (val.startsWith('ipfs://')) return val.replace('ipfs://', '');
                        if (val.startsWith('/ipfs/')) return val.replace('/ipfs/', '');
                        return val;
                    }
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        // ============================================================
        //  BACKGROUND REPLACEMENT (optimized canvas pass)
        // ============================================================
        function replaceBackground(imageUrl) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = BG_COLOR;
                ctx.fillRect(0, 0, 512, 512);

                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = imageUrl;

                img.onload = function() {
                    const imgAspect = img.width / img.height;
                    let drawW, drawH, offsetX, offsetY;
                    if (imgAspect > 1) {
                        drawH = 512;
                        drawW = 512 * imgAspect;
                        offsetX = (512 - drawW) / 2;
                        offsetY = 0;
                    } else {
                        drawW = 512;
                        drawH = 512 / imgAspect;
                        offsetX = 0;
                        offsetY = (512 - drawH) / 2;
                    }
                    ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

                    // replace corner-color pixels
                    const imageData = ctx.getImageData(0, 0, 512, 512);
                    const data = imageData.data;
                    const r = data[0];
                    const g = data[1];
                    const b = data[2];
                    const tolerance = 25;

                    for (let i = 0; i < data.length; i += 4) {
                        const pr = data[i];
                        const pg = data[i+1];
                        const pb = data[i+2];
                        if (Math.abs(pr - r) < tolerance && Math.abs(pg - g) < tolerance && Math.abs(pb - b) < tolerance) {
                            data[i] = 216;
                            data[i+1] = 255;
                            data[i+2] = 0;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                };

                img.onerror = function() {
                    // fallback
                    ctx.fillStyle = BG_COLOR;
                    ctx.fillRect(0, 0, 512, 512);
                    ctx.fillStyle = '#00000088';
                    ctx.font = '20px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⚠️ Error', 256, 256);
                    resolve(canvas.toDataURL('image/png'));
                };
            });
        }

        // ============================================================
        //  NFT CARD (processed image only)
        // ============================================================
        function createNFTCard(tokenId, dataURL) {
            const card = document.createElement('div');
            card.className = 'nft-card';
            card.dataset.tokenId = tokenId;

            const img = document.createElement('img');
            img.alt = `mfer #${tokenId}`;
            img.src = dataURL;
            img.loading = 'lazy';

            const idSpan = document.createElement('div');
            idSpan.className = 'token-id';
            idSpan.textContent = `#${tokenId}`;

            const badge = document.createElement('div');
            badge.className = 'status-badge';
            badge.textContent = '⚠️';

            card.appendChild(img);
            card.appendChild(idSpan);
            card.appendChild(badge);

            card.addEventListener('click', function() {
                openModal(tokenId, dataURL);
            });

            return card;
        }

        // ============================================================
        //  MODAL
        // ============================================================
        function openModal(tokenId, dataURL) {
            modalTitle.textContent = `#${tokenId}`;
            const canvas = modalCanvas;
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = function() {
                ctx.clearRect(0, 0, 512, 512);
                ctx.drawImage(img, 0, 0, 512, 512);
            };
            img.src = dataURL;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        //  FETCH BATCH (with retry)
        // ============================================================
        async function fetchWithRetry(url, tokenId, retries = MAX_RETRY) {
            for (let i = 0; i <= retries; i++) {
                try {
                    const res = await fetch(url, { signal: AbortSignal.timeout(10000) });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const text = await res.text();
                    return { tokenId, text };
                } catch (err) {
                    if (i === retries) {
                        return { tokenId, error: err.message };
                    }
                    await new Promise(r => setTimeout(r, 500 * (i + 1))); // backoff
                }
            }
        }

        async function fetchBatch(start, end) {
            const promises = [];
            for (let i = start; i <= end && i <= TOTAL; i++) {
                const url = `${BASE_URL}/${i}`;
                promises.push(fetchWithRetry(url, i));
            }
            return Promise.all(promises);
        }

        // ============================================================
        //  LOAD ALL (optimized batch + concurrency)
        // ============================================================
        async function loadAllNFTs() {
            if (isRunning) return;
            isRunning = true;
            gallery.innerHTML = '';
            loaded = 0;
            failed = 0;
            processedImages = [];
            downloadBtn.disabled = true;
            startTime = Date.now();
            lastCount = 0;
            updateStatus('Loading started...', 0);

            let processed = 0;
            const batchSize = CONCURRENT_LIMIT;

            for (let start = 1; start <= TOTAL; start += batchSize) {
                const end = Math.min(start + batchSize - 1, TOTAL);
                const results = await fetchBatch(start, end);

                // process each result in parallel
                const processPromises = results.map(async (res) => {
                    let cid = null;
                    let isError = false;

                    if (res.error) {
                        failed++;
                        isError = true;
                        cid = 'QmZ4tDuvesekSs4rMqS8Vj6Tj5Ht6pXH4s8b3JqW4kL1v2';
                    } else {
                        cid = extractImageCid(res.text);
                        if (!cid) {
                            failed++;
                            isError = true;
                            cid = 'QmZ4tDuvesekSs4rMqS8Vj6Tj5Ht6pXH4s8b3JqW4kL1v2';
                        }
                    }

                    const imageUrl = `${GATEWAY}/${cid}`;
                    const dataURL = await replaceBackground(imageUrl);

                    // build card (appended to DOM later)
                    const card = createNFTCard(res.tokenId, dataURL);
                    if (isError) {
                        const badge = card.querySelector('.status-badge');
                        if (badge) badge.classList.add('show');
                    }

                    return { tokenId: res.tokenId, dataURL, card, isError };
                });

                const batchResults = await Promise.all(processPromises);

                // append to DOM together
                const fragment = document.createDocumentFragment();
                for (const item of batchResults) {
                    processedImages.push({ tokenId: item.tokenId, dataURL: item.dataURL });
                    fragment.appendChild(item.card);
                    if (!item.isError) loaded++;
                }
                gallery.appendChild(fragment);

                processed += results.length;
                const speed = Math.round((loaded - lastCount) / ((Date.now() - startTime) / 1000));
                lastCount = loaded;
                updateStatus(`Processed: ${processed}/${TOTAL}`, processed);
                speedIndicator.textContent = `🚀 ${speed || 0}/sec`;

                await new Promise(r => setTimeout(r, 20));
            }

            updateStatus(`✅ Complete! Loaded: ${loaded}, Failed: ${failed}`, loaded);
            speedIndicator.textContent = `✅ Done`;
            downloadBtn.disabled = false;
            isRunning = false;
        }

        // ============================================================
        //  ZIP DOWNLOAD (reliable - streaming)
        // ============================================================
        async function downloadAllAsZip() {
            if (processedImages.length === 0) {
                alert('No images have been processed yet. Please load the gallery first.');
                return;
            }

            downloadBtn.disabled = true;
            downloadBtn.textContent = 'Building ZIP...';

            try {
                const zip = new JSZip();
                const folder = zip.folder('mfer_bg_replaced');

                // add in batches to save memory
                const batchSize = 100;
                for (let i = 0; i < processedImages.length; i += batchSize) {
                    const batch = processedImages.slice(i, i + batchSize);
                    const blobPromises = batch.map(async (item) => {
                        const response = await fetch(item.dataURL);
                        const blob = await response.blob();
                        return { tokenId: item.tokenId, blob };
                    });

                    const blobResults = await Promise.all(blobPromises);
                    for (const result of blobResults) {
                        folder.file(`mfer_${result.tokenId}.png`, result.blob);
                    }

                    // progress update
                    const progress = Math.min(i + batchSize, processedImages.length);
                    downloadBtn.textContent = `${progress}/${processedImages.length}`;
                }

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                saveAs(zipBlob, 'mfer_10000_bg_replaced.zip');
                downloadBtn.textContent = '✅ Download complete!';
                setTimeout(() => {
                    downloadBtn.textContent = 'Download All as ZIP';
                }, 3000);
            } catch (error) {
                console.error('ZIP creation failed:', error);
                alert('There was a problem creating the ZIP. Please try again.');
            }

            downloadBtn.disabled = false;
            downloadBtn.textContent = 'Download All as ZIP';
        }

        // ============================================================
        //  STATUS UPDATE
        // ============================================================
        function updateStatus(msg, count) {
            loadedSpan.textContent = count || loaded;
            totalSpan.textContent = TOTAL.toLocaleString('en-US');
            statusMsg.textContent = msg;
        }

        // ============================================================
        //  START
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            loadAllNFTs();
        });
    </script>
</body>
</html>
