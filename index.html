<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mfer NFT অ্যাডভান্সড ডাউনলোডার</title>
    <!-- JSZip লাইব্রেরি -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a1a; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; color: #fff; }
        h1 { text-align: center; margin-bottom: 5px; font-size: 2.2rem; color: #4caf50; }
        .sub { text-align: center; color: #aaa; margin-bottom: 25px; font-size: 1rem; }
        
        .control-panel {
            max-width: 650px;
            margin: 0 auto 30px;
            background: #242424;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #333;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .btn {
            background: #4caf50; border: none; color: #000; font-weight: bold;
            padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 1rem;
            margin: 8px 4px; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px;
        }
        .btn:hover { background: #66bb6a; transform: translateY(-1px); }
        .btn:disabled { background: #444; color: #777; cursor: not-allowed; transform: none; }
        .btn-zip { background: #ff9800; }
        .btn-zip:hover { background: #ffa726; }
        .btn-csv { background: #e91e63; color: #fff; }
        .btn-csv:hover { background: #ec407a; }
        
        .upload-box {
            margin-top: 15px; padding: 12px; background: #151515; 
            border: 2px dashed #444; border-radius: 8px; display: block; cursor: pointer;
        }
        .upload-box:hover { border-color: #4caf50; }
        #fileInput { display: none; }

        .progress-box { margin-top: 15px; font-size: 1.05rem; font-weight: 500; }
        .progress-bar-container {
            width: 100%; background: #333; height: 10px; border-radius: 5px;
            margin-top: 10px; overflow: hidden; display: none;
        }
        .progress-bar { width: 0%; height: 100%; background: #4caf50; transition: width 0.1s; }

        .gallery {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; max-width: 1400px; margin: 0 auto; padding-bottom: 60px;
        }
        .nft-card {
            background: #242424; border-radius: 12px; padding: 10px;
            text-align: center; border: 1px solid #333; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .nft-card img { 
            width: 100%; aspect-ratio: 1; object-fit: cover; 
            border-radius: 8px; background: #242424; display: block; 
        }
        .nft-card .id { color: #fff; font-weight: bold; margin-top: 8px; font-size: 0.95rem; }
        .nft-card .status { font-size: 0.8rem; margin-top: 4px; padding: 2px 6px; border-radius: 4px; display: inline-block; }
        .status.waiting { background: #333; color: #aaa; }
        .status.success { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .status.fail { background: rgba(244, 67, 54, 0.2); color: #f44336; }
    </style>
</head>
<body>

    <h1>📦 mfer NFT বাল্ক ডাউনলোডার ও রিট্রাই সিস্টেম</h1>
    <p class="sub">ডাটা লোড, জিপ তৈরি এবং ব্যর্থ টোকেনের CSV ডাউনলোডের অ্যাডভান্সড টুল</p>
    
    <div class="control-panel">
        <button class="btn" id="btnStart" onclick="startProcess()">🚀 প্রসেস শুরু করুন</button>
        <button class="btn btn-zip" id="btnDownload" onclick="downloadZip()" disabled>📥 জিপ ডাউনলোড</button>
        <button class="btn btn-csv" id="btnCSV" onclick="downloadFailedCSV()" disabled>📄 ব্যর্থ CSV ডাউনলোড</button>
        
        <label class="upload-box" for="fileInput">
            📂 এখানে ফেইল হওয়া CSV আপলোড করে আবার ট্রাই করুন
            <input type="file" id="fileInput" accept=".csv" onchange="handleCSVUpload(event)" />
        </label>

        <div class="progress-box" id="progressText">স্ট্যাটাস: অপেক্ষমান...</div>
        <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>
    </div>

    <div class="gallery" id="gallery"></div>

    <script>
        // মূল ৫১৭টি টোকেন আইডির প্রাথমিক লিস্ট
        let TARGET_IDS = [
            465, 439, 432, 414, 473, 397, 204, 583, 564, 71, 268, 237, 682, 505, 796, 736, 625, 697, 979, 546, 
            866, 576, 726, 1025, 1077, 1059, 1170, 920, 966, 1218, 1290, 1145, 1374, 1372, 1370, 1307, 1354, 1317, 1406, 1419, 
            1599, 1474, 1693, 1667, 1675, 1618, 1787, 1756, 1740, 1876, 1928, 1982, 1815, 1824, 2191, 2108, 2061, 2008, 2044, 2056, 
            2238, 2269, 2263, 2216, 2390, 2337, 2320, 2404, 2521, 2552, 2503, 2445, 2496, 2642, 2650, 2673, 2776, 2724, 2726, 2816, 
            2869, 2898, 2872, 2901, 2927, 2955, 3175, 3108, 3014, 3004, 3045, 3034, 3236, 3230, 3283, 3290, 3217, 3326, 3376, 3302, 
            3459, 3422, 3409, 3405, 3443, 3505, 3591, 3589, 3550, 3514, 3504, 3662, 3664, 3629, 3620, 3704, 3795, 3717, 3740, 3719, 
            3868, 3816, 3848, 3949, 3942, 3971, 3968, 4174, 4175, 4140, 4125, 4015, 4038, 4016, 4220, 4235, 4233, 4252, 4293, 4216, 
            4315, 4390, 4353, 4323, 4363, 4426, 4434, 4410, 4478, 4453, 4481, 4529, 4543, 4549, 4596, 4509, 4578, 4571, 4616, 4642, 
            4687, 4608, 4679, 4771, 4786, 4774, 4772, 4710, 4704, 4701, 4731, 4744, 4801, 4867, 4821, 4872, 4879, 4975, 4973, 4991, 
            4922, 4930, 4954, 5064, 5013, 5143, 5136, 5174, 5104, 5152, 5233, 5258, 5277, 5262, 5271, 5328, 5345, 5324, 5334, 5312, 
            5390, 5309, 5303, 5360, 5493, 5439, 5438, 5427, 5406, 5459, 5557, 5530, 5519, 5560, 5594, 5506, 5599, 5590, 5633, 5605, 
            5609, 5649, 5670, 5616, 5664, 5747, 5745, 5702, 5723, 5770, 5797, 5764, 5849, 5846, 5873, 5870, 5854, 5801, 5824, 5928, 
            5998, 5971, 5940, 5941, 5909, 6061, 6006, 6023, 6046, 6161, 6164, 6184, 6103, 6114, 6265, 6288, 6220, 6245, 6386, 6310, 
            6318, 6344, 6393, 6496, 6408, 6427, 6407, 6479, 6592, 6524, 6545, 6554, 6563, 6678, 6625, 6696, 6682, 6632, 6745, 6790, 
            6706, 6723, 6718, 6867, 6853, 6878, 6874, 6806, 6898, 6960, 6917, 6932, 7068, 7065, 7027, 7006, 7041, 7056, 7120, 7136, 
            7166, 7150, 7111, 7291, 7268, 7289, 7215, 7226, 7254, 7352, 7378, 7377, 7349, 7306, 7304, 7474, 7457, 7490, 7443, 7444, 
            7433, 7520, 7586, 7582, 7508, 7552, 7564, 7642, 7643, 7626, 7668, 7618, 7752, 7711, 7727, 7726, 7731, 7780, 7793, 7799, 
            7773, 7815, 7856, 7891, 7872, 7806, 7847, 7824, 7943, 7914, 7919, 7904, 8089, 8046, 8013, 8031, 8056, 8168, 8116, 8140, 
            8107, 8142, 8121, 8143, 8295, 8282, 8223, 8243, 8234, 8263, 8366, 8336, 8378, 8303, 8345, 8347, 8464, 8419, 8425, 8408, 
            8444, 8438, 8565, 8547, 8555, 8593, 8537, 8531, 8539, 8507, 8661, 8612, 8645, 8697, 8698, 8670, 8684, 8743, 8728, 8761, 
            8759, 8780, 8794, 8711, 8704, 8731, 8820, 8847, 8872, 8871, 8891, 8860, 8979, 8943, 8928, 8933, 8908, 8956, 9037, 9051, 
            9075, 9081, 9062, 9064, 9119, 9170, 9172, 9179, 9139, 9140, 9143, 9243, 9283, 9225, 9222, 9239, 9370, 9387, 9347, 9308, 
            9330, 9324, 9316, 9363, 9460, 9425, 9405, 9414, 9546, 9598, 9574, 9570, 9508, 9534, 9520, 9632, 9662, 9673, 9625, 9607, 
            9722, 9779, 9713, 9741, 9744, 9736, 9879, 9866, 9845, 9811, 9831, 9801, 9856, 9928, 9965, 9979, 9911
        ];

        const BASE_URL = 'https://ipfs.io/ipfs/QmWiQE65tmpYzcokCheQmng2DCM33DEhjXcPB6PanwpAZo';
        const GATEWAY = 'https://ipfs.io/ipfs';
        const CONCURRENT_LIMIT = 25; // নেটওয়ার্ক স্টেবল রাখতে ২৫টি করে ফেচ হবে

        const zip = new JSZip();
        let failedIds = [];
        let processedCount = 0;
        let successCount = 0;

        function extractCid(text) {
            try {
                const data = JSON.parse(text);
                let img = data.image || data.image_data;
                if (!img) return null;
                if (img.startsWith('ipfs://')) return img.replace('ipfs://', '');
                if (img.startsWith('/ipfs/')) return img.replace('/ipfs/', '');
                if (img.includes('ipfs.io/ipfs/')) return img.split('ipfs.io/ipfs/')[1].split('?')[0];
                return img;
            } catch (e) { return null; }
        }

        async function fetchImageBlob(cid) {
            const url = `${GATEWAY}/${cid}`;
            const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
            if (!res.ok) throw new Error("Image error");
            return res.blob();
        }

        async function processToken(id) {
            // পূর্বের ডামি বা কার্ড থাকলে তা ক্লিয়ার বা নতুন কার্ড তৈরি
            let card = document.getElementById(`card-${id}`);
            if (!card) {
                card = document.createElement('div');
                card.className = 'nft-card';
                card.id = `card-${id}`;
                document.getElementById('gallery').appendChild(card);
            }
            card.innerHTML = `<div class="id">#${id}</div><div class="status waiting" id="status-${id}">⏳ মেটাডাটা...</div>`;

            try {
                const metaRes = await fetch(`${BASE_URL}/${id}`, { signal: AbortSignal.timeout(10000) });
                if (!metaRes.ok) throw new Error("Metadata failed");
                const text = await metaRes.text();
                
                const cid = extractCid(text);
                if (!cid) throw new Error("No CID");

                document.getElementById(`status-${id}`).innerText = "⏳ ইমেজ লোড...";
                const imageBlob = await fetchImageBlob(cid);
                
                // জিপে যুক্ত করা (নামকরণ টোকেন আইডি অনুযায়ী)
                zip.file(`mfer_${id}.png`, imageBlob);

                // UI সাকসেস স্টেট ও ব্যাকগ্রাউন্ড সিঙ্ক
                document.getElementById(`status-${id}`).innerText = "✅ সম্পন্ন";
                document.getElementById(`status-${id}`).className = "status success";
                
                const imgEl = document.createElement('img');
                imgEl.src = URL.createObjectURL(imageBlob);
                card.insertBefore(imgEl, card.firstChild);
                
                successCount++;
            } catch (err) {
                document.getElementById(`status-${id}`).innerText = "❌ ব্যর্থ";
                document.getElementById(`status-${id}`).className = "status fail";
                if (!failedIds.includes(id)) {
                    failedIds.push(id);
                }
            } finally {
                processedCount++;
                updateProgressBar();
            }
        }

        function updateProgressBar() {
            const pct = ((processedCount / TARGET_IDS.length) * 100).toFixed(1);
            document.getElementById('progressBar').style.width = `${pct}%`;
            document.getElementById('progressText').innerText = `অগ্রগতি: ${processedCount} / ${TARGET_IDS.length} (${pct}%) | সফল: ${successCount} | ব্যর্থ: ${failedIds.length}`;
        }

        async function startProcess() {
            document.getElementById('btnStart').disabled = true;
            document.getElementById('btnDownload').disabled = true;
            document.getElementById('btnCSV').disabled = true;
            document.getElementById('progressContainer').style.display = 'block';
            
            processedCount = 0;
            successCount = 0;
            failedIds = [];
            
            // নতুন প্রসেসের জন্য জিপ অবজেক্ট খালি করা
            Object.keys(zip.files).forEach(filename => delete zip.files[filename]);

            const pool = [];
            for (let id of TARGET_IDS) {
                if (pool.length >= CONCURRENT_LIMIT) {
                    await Promise.race(pool);
                }
                const p = processToken(id).then(() => {
                    pool.splice(pool.indexOf(p), 1);
                });
                pool.push(p);
            }
            await Promise.all(pool);

            document.getElementById('progressText').innerText = `🎉 রান শেষ! সফল: ${successCount}টি, ব্যর্থ: ${failedIds.length}টি।`;
            
            if (successCount > 0) document.getElementById('btnDownload').disabled = false;
            if (failedIds.length > 0) document.getElementById('btnCSV').disabled = false;
            document.getElementById('btnStart').disabled = false;
        }

        // জিপ ফাইল ডাউনলোড
        function downloadZip() {
            document.getElementById('progressText').innerText = "⏳ জিপ ফাইল জেনারেট হচ্ছে...";
            zip.generateAsync({ type: "blob" }).then(function(content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "mfers_loaded_tokens.zip";
                link.click();
                document.getElementById('progressText').innerText = "✅ জিপ ফাইল সাকসেসফুলি ডাউনলোড হয়েছে!";
            });
        }

        // ব্যর্থ হওয়া টোকেন আইডিগুলোর CSV ডাউনলোড
        function downloadFailedCSV() {
            if (failedIds.length === 0) return;
            let csvContent = "data:text/csv;charset=utf-8,Failed_Token_ID\n" + failedIds.join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `failed_tokens_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // CSV ফাইল আপলোড হ্যান্ডলার (পরবর্তীতে রান করার জন্য)
        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split("\n");
                const newIds = [];
                
                for (let i = 1; i < lines.length; i++) {
                    const idStr = lines[i].trim();
                    if (idStr && !isNaN(idStr)) {
                        newIds.push(parseInt(idStr, 10));
                    }
                }
                
                if (newIds.length > 0) {
                    TARGET_IDS = newIds;
                    document.getElementById('gallery').innerHTML = ''; // পূর্বের গ্যালারি রিসেট
                    document.getElementById('progressText').innerText = `📂 CSV থেকে ${TARGET_IDS.length}টি ব্যর্থ আইডি আপলোড হয়েছে! রেডি টু রান।`;
                    document.getElementById('btnStart').disabled = false;
                } else {
                    alert("সঠিক CSV ফাইল পাওয়া যায়নি বা ফাইলটি খালি!");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
