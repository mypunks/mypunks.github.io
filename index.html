<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mfer · #D8FF00 Collection</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg: #0a0a0b;
            --bg-elevated: #131315;
            --card: #17171a;
            --card-border: #26262a;
            --lime: #D8FF00;
            --lime-dim: #D8FF0022;
            --text: #f2f2ef;
            --text-dim: #8f8f94;
            --error: #ff5470;
            --error-dim: #ff547022;
            --radius-lg: 20px;
            --radius-md: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse 1200px 700px at 50% -10%, #1c1f0c 0%, var(--bg) 55%), var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            padding: 48px 24px 96px;
            min-height: 100vh;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .brand .swatch {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            background: var(--lime);
            box-shadow: 0 0 18px var(--lime-dim), 0 0 4px var(--lime);
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            letter-spacing: -0.02em;
            text-align: center;
            color: var(--text);
        }

        h1 .hash { color: var(--lime); }

        .sub {
            text-align: center;
            color: var(--text-dim);
            margin-top: 10px;
            font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sub .count-pill {
            background: var(--bg-elevated);
            border: 1px solid var(--card-border);
            color: var(--lime);
            padding: 3px 12px;
            border-radius: 30px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 44px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            font-weight: 600;
            padding: 13px 28px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
            letter-spacing: 0.01em;
        }

        .btn-primary {
            background: var(--lime);
            color: #0a0a0b;
            box-shadow: 0 0 0 1px #D8FF0033, 0 8px 24px -6px #D8FF0055;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 0 1px #D8FF0055, 0 14px 30px -6px #D8FF0077;
        }
        .btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--card-border);
        }
        .btn-ghost:hover {
            border-color: var(--lime);
            color: var(--lime);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: transparent;
            color: var(--error);
            border: 1px solid var(--error);
            box-shadow: 0 0 10px var(--error-dim);
        }
        .btn-danger:hover:not(:disabled) {
            background: var(--error);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px var(--error-dim);
        }
        .btn-danger:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .nft-card {
            background: var(--card);
            border-radius: var(--radius-md);
            padding: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            text-align: center;
            border: 1px solid var(--card-border);
            cursor: pointer;
            position: relative;
        }
        .nft-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px -12px rgba(216, 255, 0, 0.18);
            border-color: var(--lime);
            z-index: 2;
        }
        .nft-card.is-error-card {
            border-color: rgba(255, 84, 112, 0.4);
        }
        .nft-card.is-error-card:hover {
            border-color: var(--error);
            box-shadow: 0 16px 40px -12px rgba(255, 84, 112, 0.2);
        }
        .nft-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            background: var(--lime);
        }
        .nft-card .token-id {
            color: var(--lime);
            font-weight: 600;
            margin-top: 8px;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-elevated);
            padding: 3px 10px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid #D8FF0022;
        }
        .nft-card.is-error-card .token-id {
            color: var(--error);
            border-color: rgba(255, 84, 112, 0.2);
        }
        .nft-card .status-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--error);
            color: #fff;
            font-size: 0.62rem;
            font-weight: 600;
            padding: 2px 9px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .nft-card .status-badge.show { opacity: 1; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(6, 6, 7, 0.9);
            backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--bg-elevated);
            border-radius: var(--radius-lg);
            padding: 22px;
            box-shadow: 0 0 80px rgba(216, 255, 0, 0.15);
            border: 1px solid var(--card-border);
            max-width: 560px;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .modal-content .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 1.8rem;
            color: var(--text-dim);
            cursor: pointer;
            background: none;
            border: none;
            font-weight: 400;
            transition: transform 0.2s, color 0.2s;
            line-height: 1;
        }
        .modal-content .close-btn:hover {
            transform: scale(1.2);
            color: var(--lime);
        }
        .modal-content .modal-title {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--lime);
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 512px;
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            background: var(--lime);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--card-border);
        }
        .canvas-wrapper canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
        
        .modal-retry-area {
            display: none;
            justify-content: center;
            margin-top: 5px;
        }
        .modal-retry-area.show { display: flex; }

        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 11, 0.85);
            backdrop-filter: blur(10px);
            color: var(--text-dim);
            padding: 12px 24px;
            text-align: center;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            border-top: 1px solid var(--card-border);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .status-bar span {
            background: var(--bg-elevated);
            border: 1px solid var(--card-border);
            padding: 3px 14px;
            border-radius: 30px;
        }
        .status-bar .highlight { color: var(--lime); font-weight: 600; }
        .status-bar .failed-highlight { color: var(--error); font-weight: 600; }

        @media (max-width: 1100px) {
            .gallery { grid-template-columns: repeat(4, 1fr); }
        }
        @media (max-width: 800px) {
            .gallery { grid-template-columns: repeat(3, 1fr); gap: 12px; }
        }
        @media (max-width: 520px) {
            h1 { font-size: 1.9rem; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .modal-content { padding: 16px; }
        }
    </style>
</head>
<body>

    <div class="brand">
        <div class="swatch"></div>
        <h1>mfer <span class="hash">· #D8FF00</span></h1>
        <p class="sub">Dynamic Recovery Pipeline <span class="count-pill">10,000 NFTs</span></p>
    </div>

    <div class="controls">
        <button class="btn btn-primary" id="downloadAllBtn" onclick="downloadAllAsZip()">Download All as ZIP</button>
        <button class="btn btn-danger" id="retryFailedBtn" onclick="retryAllFailed()" disabled>Retry All Failed (0)</button>
    </div>

    <div class="gallery" id="gallery"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeModalBtn">&times;</button>
            <div class="modal-title" id="modalTitle">#1234</div>
            <div class="canvas-wrapper">
                <canvas id="modalCanvas" width="512" height="512"></canvas>
            </div>
            <div class="modal-retry-area" id="modalRetryArea">
                <button class="btn btn-primary" style="background:var(--error); color:#fff; box-shadow:none;" id="singleRetryBtn">🔄 Retry Loading This Item</button>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
        <span>Loaded: <span id="loadedCount" class="highlight">0</span> / 10,000</span>
        <span>Failed: <span id="failedCount" class="failed-highlight">0</span></span>
        <span id="statusMessage">Preparing pipeline...</span>
        <span id="speedIndicator">🚀 0/sec</span>
    </div>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const BASE_URL = 'https://ipfs.io/ipfs/QmWiQE65tmpYzcokCheQmng2DCM33DEhjXcPB6PanwpAZo';
        const TOTAL = 10000;
        
        const CONCURRENT_LIMIT = 5; 
        const REQUEST_DELAY = 150; 
        
        const GATEWAYS = [
            'https://cloudflare-ipfs.com/ipfs',
            'https://ipfs.io/ipfs',
            'https://gateway.pinata.cloud/ipfs'
        ];
        
        const BG_COLOR = '#D8FF00';
        const MAX_RETRY = 3;

        // ============================================================
        // STATE STORAGE (Persistent In-Memory Array)
        // ============================================================
        let nftDataStore = new Array(TOTAL + 1).fill(null); 
        let isRunning = false;
        let activeModalTokenId = null;
        let startTime = 0;

        // DOM Elements
        const gallery = document.getElementById('gallery');
        const loadedSpan = document.getElementById('loadedCount');
        const failedSpan = document.getElementById('failedCount');
        const statusMsg = document.getElementById('statusMessage');
        const speedIndicator = document.getElementById('speedIndicator');
        const downloadBtn = document.getElementById('downloadAllBtn');
        const retryFailedBtn = document.getElementById('retryFailedBtn');

        const modalOverlay = document.getElementById('modalOverlay');
        const modalCanvas = document.getElementById('modalCanvas');
        const modalTitle = document.getElementById('modalTitle');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalRetryArea = document.getElementById('modalRetryArea');
        const singleRetryBtn = document.getElementById('singleRetryBtn');

        // ============================================================
        // CORE PIPELINE FUNCTIONS
        // ============================================================
        function extractImageCid(metadata) {
            try {
                let data = typeof metadata === 'string' ? JSON.parse(metadata) : metadata;
                if (data.image) {
                    let img = data.image;
                    if (img.startsWith('ipfs://')) return img.replace('ipfs://', '');
                    if (img.startsWith('/ipfs/')) return img.replace('/ipfs/', '');
                    if (img.includes('ipfs.io/ipfs/')) {
                        return img.split('ipfs.io/ipfs/')[1]?.split('?')[0] || img;
                    }
                    return img;
                }
                return null;
            } catch (e) { return null; }
        }

        async function fetchImageAndReplaceBackground(cid, attempt = 0) {
            const gatewayUrl = `${GATEWAYS[attempt % GATEWAYS.length]}/${cid}`;
            try {
                const response = await fetch(gatewayUrl, { signal: AbortSignal.timeout(9000) });
                if (!response.ok) throw new Error('Gateway Fail');
                const blob = await response.blob();
                
                return new Promise((resolve) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512;
                    canvas.height = 512;
                    const ctx = canvas.getContext('2d');

                    ctx.fillStyle = BG_COLOR;
                    ctx.fillRect(0, 0, 512, 512);

                    const img = new Image();
                    const objectURL = URL.createObjectURL(blob);
                    img.src = objectURL;

                    img.onload = function() {
                        const imgAspect = img.width / img.height;
                        let drawW, drawH, offsetX, offsetY;
                        if (imgAspect > 1) {
                            drawH = 512; drawW = 512 * imgAspect;
                            offsetX = (512 - drawW) / 2; offsetY = 0;
                        } else {
                            drawW = 512; drawH = 512 / imgAspect;
                            offsetX = 0; offsetY = (512 - drawH) / 2;
                        }
                        ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

                        const imageData = ctx.getImageData(0, 0, 512, 512);
                        const data = imageData.data;
                        const r = data[0], g = data[1], b = data[2];
                        const tolerance = 25;

                        for (let j = 0; j < data.length; j += 4) {
                            if (Math.abs(data[j] - r) < tolerance && 
                                Math.abs(data[j+1] - g) < tolerance && 
                                Math.abs(data[j+2] - b) < tolerance) {
                                data[j] = 216; data[j+1] = 255; data[j+2] = 0;
                            }
                        }
                        ctx.putImageData(imageData, 0, 0);
                        URL.revokeObjectURL(objectURL);
                        resolve({ success: true, dataURL: canvas.toDataURL('image/png') });
                    };
                    img.onerror = () => { URL.revokeObjectURL(objectURL); resolve({ success: false }); };
                });
            } catch (err) {
                if (attempt < MAX_RETRY) {
                    await new Promise(r => setTimeout(r, 400));
                    return fetchImageAndReplaceBackground(cid, attempt + 1);
                }
                return { success: false };
            }
        }

        async function fetchMetadataWithRetry(tokenId, retries = MAX_RETRY) {
            for (let i = 0; i <= retries; i++) {
                const gatewayBase = i === 0 ? BASE_URL : GATEWAYS[i % GATEWAYS.length] + '/QmWiQE65tmpYzcokCheQmng2DCM33DEhjXcPB6PanwpAZo';
                try {
                    const res = await fetch(`${gatewayBase}/${tokenId}`, { signal: AbortSignal.timeout(7000) });
                    if (!res.ok) throw new Error();
                    return await res.text();
                } catch (err) {
                    if (i === retries) return null;
                    await new Promise(r => setTimeout(r, 500 * (i + 1)));
                }
            }
        }

        // ============================================================
        // SINGLE CARD PROCESSING & IN-PLACE UPDATE
        // ============================================================
        async function processSingleNFT(tokenId) {
            const rawMetadata = await fetchMetadataWithRetry(tokenId);
            let cid = null;
            let result = { success: false };

            if (rawMetadata) {
                cid = extractImageCid(rawMetadata);
                if (cid) result = await fetchImageAndReplaceBackground(cid);
            }

            let finalDataURL = result.dataURL;
            if (!result.success) {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = BG_COLOR; ctx.fillRect(0, 0, 512, 512);
                ctx.fillStyle = '#17171a'; ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center';
                ctx.fillText(`mfer #${tokenId}`, 256, 240);
                ctx.font = '16px monospace'; ctx.fillStyle = '#ff5470';
                ctx.fillText('⚠️ Gateway Timeout', 256, 280);
                finalDataURL = canvas.toDataURL('image/png');
            }

            // Save state globally
            nftDataStore[tokenId] = {
                tokenId,
                dataURL: finalDataURL,
                isError: !result.success
            };

            updateCardUI(tokenId);
            updateStatsCounter();
            return nftDataStore[tokenId];
        }

        function updateCardUI(tokenId) {
            const item = nftDataStore[tokenId];
            let card = document.querySelector(`.nft-card[data-token-id="${tokenId}"]`);
            
            const isNew = !card;
            if (isNew) {
                card = document.createElement('div');
                card.className = 'nft-card';
                card.dataset.tokenId = tokenId;
                card.innerHTML = `<img><div class="token-id"></div><div class="status-badge">⚠️</div>`;
                card.addEventListener('click', () => openModal(tokenId));
            }

            const img = card.querySelector('img');
            const idSpan = card.querySelector('.token-id');
            const badge = card.querySelector('.status-badge');

            img.src = item.dataURL;
            idSpan.textContent = `#${tokenId}`;

            if (item.isError) {
                card.classList.add('is-error-card');
                badge.classList.add('show');
            } else {
                card.classList.remove('is-error-card');
                badge.classList.remove('show');
            }

            if (isNew) {
                // Keep structural order intact inside grid layout
                gallery.appendChild(card);
            }
        }

        function updateStatsCounter() {
            let loaded = 0;
            let failed = 0;
            for(let i = 1; i <= TOTAL; i++) {
                if (nftDataStore[i]) {
                    if (nftDataStore[i].isError) failed++;
                    else loaded++;
                }
            }
            loadedSpan.textContent = loaded.toLocaleString('en-US');
            failedSpan.textContent = failed.toLocaleString('en-US');
            
            if (failed > 0) {
                retryFailedBtn.disabled = false;
                retryFailedBtn.textContent = `Retry All Failed (${failed})`;
            } else {
                retryFailedBtn.disabled = true;
                retryFailedBtn.textContent = `Retry All Failed (0)`;
            }
        }

        // ============================================================
        // MASS LOADER LOOP (Skips already cached successes)
        // ============================================================
        async function loadAllNFTs() {
            if (isRunning) return;
            isRunning = true;
            downloadBtn.disabled = true;
            startTime = Date.now();
            statusMsg.textContent = "Processing batch queue...";

            const speedInterval = setInterval(() => {
                if (!isRunning) { clearInterval(speedInterval); return; }
                let processed = nftDataStore.filter(x => x !== null).length;
                const elapsed = (Date.now() - startTime) / 1000;
                const speed = (processed / elapsed).toFixed(1);
                speedIndicator.textContent = `🚀 ${speed || 0}/sec`;
            }, 1000);

            let index = 1;
            const queueWorker = async () => {
                while (index <= TOTAL) {
                    const currentId = index++;
                    if (currentId > TOTAL) break;

                    // STRICT CONDITION: If already successfully loaded, protect it and skip
                    if (nftDataStore[currentId] && !nftDataStore[currentId].isError) {
                        // Ensure UI elements are constructed if empty
                        if(!document.querySelector(`.nft-card[data-token-id="${currentId}"]`)) {
                            updateCardUI(currentId);
                        }
                        continue;
                    }

                    await new Promise(resolve => setTimeout(resolve, REQUEST_DELAY));
                    await processSingleNFT(currentId);
                }
            };

            const workers = Array(CONCURRENT_LIMIT).fill(null).map(() => queueWorker());
            await Promise.all(workers);

            clearInterval(speedInterval);
            isRunning = false;
            statusMsg.textContent = "✅ System Idle / Stable";
            speedIndicator.textContent = `✅ Active`;
            downloadBtn.disabled = false;
            updateStatsCounter();
        }

        // ============================================================
        // RETRY CONTROLS (Targeted Single & Batch)
        // ============================================================
        async function retrySingleItem(tokenId) {
            singleRetryBtn.disabled = true;
            singleRetryBtn.textContent = '⚡ Reloading...';
            
            statusMsg.textContent = `Retrying item #${tokenId}...`;
            const updatedItem = await processSingleNFT(tokenId);

            // Dynamically refresh modal context view instantly
            const ctx = modalCanvas.getContext('2d');
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, 512, 512);
                ctx.drawImage(img, 0, 0, 512, 512);
            };
            img.src = updatedItem.dataURL;

            if (!updatedItem.isError) {
                modalRetryArea.classList.remove('show');
                statusMsg.textContent = `✅ Item #${tokenId} Fixed!`;
            } else {
                statusMsg.textContent = `❌ Item #${tokenId} Timeout Again.`;
            }
            
            singleRetryBtn.disabled = false;
            singleRetryBtn.textContent = '🔄 Retry Loading This Item';
        }

        async function retryAllFailed() {
            if (isRunning) return;
            isRunning = true;
            retryFailedBtn.disabled = true;
            statusMsg.textContent = "Retrying failed queue items exclusively...";

            let failedIds = [];
            for (let i = 1; i <= TOTAL; i++) {
                if (nftDataStore[i] && nftDataStore[i].isError) failedIds.push(i);
            }

            let poolIndex = 0;
            const queueWorker = async () => {
                while (poolIndex < failedIds.length) {
                    const tokenId = failedIds[poolIndex++];
                    if (!tokenId) break;

                    await new Promise(r => setTimeout(r, REQUEST_DELAY));
                    await processSingleNFT(tokenId);
                }
            };

            const workers = Array(CONCURRENT_LIMIT).fill(null).map(() => queueWorker());
            await Promise.all(workers);

            isRunning = false;
            statusMsg.textContent = "✅ Failed Queue Retried.";
            updateStatsCounter();
        }

        // ============================================================
        // MODAL INTERFACE
        // ============================================================
        function openModal(tokenId) {
            activeModalTokenId = tokenId;
            const item = nftDataStore[tokenId];
            modalTitle.textContent = `#${tokenId}`;
            
            const ctx = modalCanvas.getContext('2d');
            const img = new Image();
            img.onload = () => {
                ctx.clearRect(0, 0, 512, 512);
                ctx.drawImage(img, 0, 0, 512, 512);
            };
            img.src = item.dataURL;

            if (item.isError) {
                modalRetryArea.classList.add('show');
            } else {
                modalRetryArea.classList.remove('show');
            }

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
            activeModalTokenId = null;
        }

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) { if (e.target === this) closeModal(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
        singleRetryBtn.addEventListener('click', () => {
            if (activeModalTokenId) retrySingleItem(activeModalTokenId);
        });

        // ============================================================
        // ZIP PACKER
        // ============================================================
        async function downloadAllAsZip() {
            const currentProcessed = nftDataStore.filter(x => x !== null);
            if (currentProcessed.length === 0) return;
            downloadBtn.disabled = true;
            downloadBtn.textContent = 'Packing Files...';

            try {
                const zip = new JSZip();
                const folder = zip.folder('mfer_neon_bg');
                const batchSize = 100;

                for (let i = 0; i < currentProcessed.length; i += batchSize) {
                    const batch = currentProcessed.slice(i, i + batchSize);
                    await Promise.all(batch.map(async (item) => {
                        const response = await fetch(item.dataURL);
                        const blob = await response.blob();
                        folder.file(`mfer_${item.tokenId}.png`, blob);
                    }));
                    downloadBtn.textContent = `Compiling: ${Math.min(i + batchSize, currentProcessed.length)}/${currentProcessed.length}`;
                }

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                saveAs(zipBlob, 'mfer_neon_collection.zip');
                downloadBtn.textContent = '✅ Downloaded!';
                setTimeout(() => { downloadBtn.textContent = 'Download All as ZIP'; }, 3000);
            } catch (error) {
                alert('ZIP packing failed.');
            }
            downloadBtn.disabled = false;
        }

        // Init App Loop
        window.addEventListener('DOMContentLoaded', () => {
            loadAllNFTs();
        });
    </script>
</body>
</html>
