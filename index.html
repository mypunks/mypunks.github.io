<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Layer Studio Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { padding: 20px; background: #f4f6f8; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { margin-bottom: 20px; color: #1a73e8; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    select, input[type="file"], input[type="text"], button { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { background: #1a73e8; color: #fff; border: none; cursor: pointer; font-weight: bold; margin-top: 15px; }
    button:hover { background: #1557b0; }
    .status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; text-align: center; }
    .status.success { background: #d4edda; color: #155724; display: block; }
    .status.error { background: #f8d7da; color: #721c24; display: block; }
    .preview-box { margin-top: 20px; text-align: center; border: 1px dashed #ccc; padding: 15px; min-height: 150px; display: flex; align-items: center; justify-content: center; }
    .preview-box svg { max-width: 200px; max-height: 200px; }
  </style>

  <!-- Firebase Component Loading -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
  <h1>SVG Layer Studio Pro</h1>

  <div class="form-group">
    <label for="layerCategory">লেয়ার ক্যাটাগরি (Folder / Category):</label>
    <select id="layerCategory">
      <option value="Background">Background (ব্যাকগ্রাউন্ড)</option>
      <option value="Base">Base Character (বেস)</option>
      <option value="Hats">Hats (টুপি)</option>
      <option value="Outfits">Outfits (পোশাক)</option>
      <option value="Eyewear">Eyewear (চশমা)</option>
      <option value="Eyes">Eyes (চোখ)</option>
      <option value="Hair">Hair (চুল)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="assetName">অ্যাসেট বা লেয়ার নাম:</label>
    <input type="text" id="assetName" placeholder="যেমন: Red Background বা Retro Glasses">
  </div>

  <div class="form-group">
    <label for="svgFile">SVG ফাইল নির্বাচন করুন:</label>
    <input type="file" id="svgFile" accept=".svg">
  </div>

  <div class="preview-box" id="previewBox">
    <span>SVG প্রিভিউ এখানে দেখাবে</span>
  </div>

  <button id="uploadBtn">ফায়ারবেসে সেভ/আপলোড করুন</button>
  <div id="statusMsg" class="status"></div>
</div>

<script>
  // 1. আপনার Firebase প্রজেক্টের কনফিগারেশন দিন
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // Firebase ইনিশিয়ালাইজেশন
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const database = firebase.database();

  let loadedSvgContent = "";

  // SVG ফাইল রিড ও প্রিভিউ
  document.getElementById('svgFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file && file.type === "image/svg+xml") {
      const reader = new FileReader();
      reader.onload = function(evt) {
        loadedSvgContent = evt.target.result;
        document.getElementById('previewBox').innerHTML = loadedSvgContent;
      };
      reader.readAsText(file);
    } else {
      showStatus("অনুগ্রহ করে একটি সঠিক SVG ফাইল নির্বাচন করুন।", false);
    }
  });

  // Firebase-এ ডাটা আপলোড
  document.getElementById('uploadBtn').addEventListener('click', function() {
    const category = document.getElementById('layerCategory').value;
    const name = document.getElementById('assetName').value.trim();

    if (!name) {
      showStatus("অনুগ্রহ করে লেয়ারের নাম লিখুন!", false);
      return;
    }
    if (!loadedSvgContent) {
      showStatus("অনুগ্রহ করে একটি SVG ফাইল সিলেক্ট করুন!", false);
      return;
    }

    // ফায়ারবেসের জন্য কি (Key) নিরাপদ করা
    const safeKey = name.replace(/[.#$[\]/]/g, "_");

    // Firebase Database-এ সেভ করা
    database.ref('svg_layers/' + category + '/' + safeKey).set({
      name: name,
      category: category,
      svgCode: loadedSvgContent,
      timestamp: Date.now()
    }).then(() => {
      showStatus("সফলভাবে Firebase-এ SVG লেয়ার যুক্ত হয়েছে!", true);
      // রিসেট ফর্ম
      document.getElementById('assetName').value = '';
      document.getElementById('svgFile').value = '';
      document.getElementById('previewBox').innerHTML = '<span>SVG প্রিভিউ এখানে দেখাবে</span>';
      loadedSvgContent = "";
    }).catch((error) => {
      console.error(error);
      showStatus("আপলোড ব্যর্থ হয়েছে: " + error.message, false);
    });
  });

  function showStatus(message, isSuccess) {
    const statusEl = document.getElementById('statusMsg');
    statusEl.innerText = message;
    statusEl.className = 'status ' + (isSuccess ? 'success' : 'error');
  }
</script>

</body>
</html>
