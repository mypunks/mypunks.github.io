<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mfer · ব্যাকগ্রাউন্ড রিপ্লেস ইঞ্জিন</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 6px;
            font-size: 2.5rem;
            text-shadow: 0 0 20px #D8FF0066;
        }
        .sub {
            text-align: center;
            color: #aaa;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
        .sub span {
            background: #D8FF00;
            color: #000;
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: bold;
        }
        .upload-area {
            border: 3px dashed #D8FF00;
            border-radius: 20px;
            padding: 60px 20px;
            text-align: center;
            max-width: 700px;
            margin: 20px auto;
            background: #222;
            cursor: pointer;
            transition: 0.3s;
        }
        .upload-area:hover {
            background: #2a2a2a;
            border-color: #fff;
        }
        .upload-area.dragover {
            background: #333;
            border-color: #fff;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        .upload-area .icon {
            font-size: 4rem;
            color: #D8FF00;
            margin-bottom: 10px;
        }
        .upload-area p {
            color: #aaa;
            font-size: 1.1rem;
        }
        .upload-area .highlight {
            color: #D8FF00;
            font-weight: bold;
        }
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        .controls button {
            background: #D8FF00;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            box-shadow: 0 0 20px #D8FF0044;
            margin: 5px;
        }
        .controls button:hover {
            transform: scale(1.05);
            background: #fff;
            box-shadow: 0 0 40px #D8FF0088;
        }
        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .stats {
            text-align: center;
            color: #aaa;
            margin: 20px 0;
            font-size: 0.95rem;
        }
        .stats span {
            background: #222;
            padding: 4px 14px;
            border-radius: 30px;
            margin: 0 5px;
            border: 1px solid #D8FF0044;
        }
        .stats .highlight {
            color: #D8FF00;
            font-weight: bold;
        }
        .progress-container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background: #222;
            border-radius: 30px;
            overflow: hidden;
            height: 30px;
            border: 1px solid #D8FF0044;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #D8FF00, #aacc00);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 30px;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .log-container {
            max-width: 800px;
            margin: 10px auto;
            background: #111;
            border-radius: 12px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #333;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #aaa;
        }
        .log-container .log-success { color: #6f6; }
        .log-container .log-error { color: #ff6b6b; }
        .log-container .log-info { color: #6af; }
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0d0d0dcc;
            backdrop-filter: blur(6px);
            color: #aaa;
            padding: 10px 20px;
            text-align: center;
            font-size: 0.9rem;
            border-top: 1px solid #D8FF0044;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }
        .status-bar span {
            background: #222;
            padding: 2px 14px;
            border-radius: 30px;
        }
        .file-list {
            max-width: 800px;
            margin: 10px auto;
            background: #111;
            border-radius: 12px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #333;
            color: #aaa;
            font-size: 0.8rem;
            display: none;
        }
        .file-list.show { display: block; }
        .file-list .file-item {
            padding: 4px 8px;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
        }
        .file-list .file-item .name { color: #6f6; }
        .file-list .file-item .size { color: #888; }
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .upload-area { padding: 40px 15px; }
        }
    </style>
</head>
<body>

    <h1>🟢 mfer · ব্যাকগ্রাউন্ড রিপ্লেস</h1>
    <p class="sub">জিপ আপলোড করুন → ব্যাকগ্রাউন্ড <span>#D8FF00</span> → জিপ ডাউনলোড</p>

    <!-- আপলোড এরিয়া -->
    <div class="upload-area" id="uploadArea">
        <div class="icon">📁</div>
        <p>এখানে ক্লিক করুন বা <span class="highlight">জিপ ফাইল</span> ড্র্যাগ করুন</p>
        <p style="font-size:0.8rem; color:#666; margin-top:8px;">ছবির নাম হতে হবে <span class="highlight">TOKEN_ID.png</span> (যেমন: 465.png)</p>
        <input type="file" id="fileInput" accept=".zip" />
    </div>

    <div class="controls">
        <button id="processBtn" onclick="processZip()" disabled>🔄 প্রসেস শুরু</button>
        <button id="downloadBtn" onclick="downloadProcessedZip()" disabled>📦 রিপ্লেস করা জিপ ডাউনলোড</button>
    </div>

    <div class="stats">
        <span>মোট: <span class="highlight" id="totalStats">০</span></span>
        <span>প্রসেসড: <span class="highlight" id="processedStats">০</span></span>
        <span>ফেইল: <span class="highlight" id="failedStats">০</span></span>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
        <div class="progress-text" id="progressText">০%</div>
    </div>

    <div class="file-list" id="fileList">
        <div style="color:#888; margin-bottom:8px;">📄 জিপের ভিতরের ফাইলসমূহ:</div>
        <div id="fileListContent"></div>
    </div>

    <div class="log-container" id="logContainer">
        <div class="log-info">⏳ জিপ আপলোড করুন...</div>
    </div>

    <!-- স্ট্যাটাস বার -->
    <div class="status-bar" id="statusBar">
        <span id="statusMessage">প্রস্তুত...</span>
        <span id="speedIndicator">📊 ০%</span>
    </div>

    <script>
        // ============================================================
        //  কনফিগারেশন
        // ============================================================
        const BG_COLOR = '#D8FF00';
        const TARGET_SIZE = 512;

        let uploadedZip = null;
        let processedImages = []; // {tokenId, dataURL}
        let totalFiles = 0;
        let processedCount = 0;
        let failedCount = 0;
        let isProcessing = false;

        // ============================================================
        //  DOM রেফারেন্স
        // ============================================================
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const totalStats = document.getElementById('totalStats');
        const processedStats = document.getElementById('processedStats');
        const failedStats = document.getElementById('failedStats');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const logContainer = document.getElementById('logContainer');
        const statusMsg = document.getElementById('statusMessage');
        const speedIndicator = document.getElementById('speedIndicator');
        const fileList = document.getElementById('fileList');
        const fileListContent = document.getElementById('fileListContent');

        // ============================================================
        //  হেল্পার ফাংশন
        // ============================================================
        function addLog(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-${type}`;
            div.textContent = message;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateProgress(current, total) {
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
            speedIndicator.textContent = `📊 ${percent}%`;
        }

        function updateStats() {
            totalStats.textContent = totalFiles;
            processedStats.textContent = processedCount;
            failedStats.textContent = failedCount;
        }

        // ============================================================
        //  ব্যাকগ্রাউন্ড রিপ্লেস ফাংশন
        // ============================================================
        function replaceBackgroundAndGetDataURL(img, tokenId) {
            const canvas = document.createElement('canvas');
            canvas.width = TARGET_SIZE;
            canvas.height = TARGET_SIZE;
            const ctx = canvas.getContext('2d');

            // ১. ব্যাকগ্রাউন্ড #D8FF00
            ctx.fillStyle = BG_COLOR;
            ctx.fillRect(0, 0, TARGET_SIZE, TARGET_SIZE);

            // ২. ইমেজ ড্র (কভার মোড)
            const imgAspect = img.width / img.height;
            let drawW, drawH, offsetX, offsetY;
            if (imgAspect > 1) {
                drawH = TARGET_SIZE;
                drawW = TARGET_SIZE * imgAspect;
                offsetX = (TARGET_SIZE - drawW) / 2;
                offsetY = 0;
            } else {
                drawW = TARGET_SIZE;
                drawH = TARGET_SIZE / imgAspect;
                offsetX = 0;
                offsetY = (TARGET_SIZE - drawH) / 2;
            }
            ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

            // ৩. পিক্সেল বাই পিক্সেল ব্যাকগ্রাউন্ড রিপ্লেস
            const imageData = ctx.getImageData(0, 0, TARGET_SIZE, TARGET_SIZE);
            const data = imageData.data;
            
            // কর্নারের রঙ ধরা (ব্যাকগ্রাউন্ড ডিটেক্ট)
            const r = data[0];
            const g = data[1];
            const b = data[2];
            const tolerance = 30;

            let replaced = 0;
            for (let i = 0; i < data.length; i += 4) {
                const pr = data[i];
                const pg = data[i+1];
                const pb = data[i+2];
                if (Math.abs(pr - r) < tolerance && Math.abs(pg - g) < tolerance && Math.abs(pb - b) < tolerance) {
                    data[i] = 216;   // R = D8
                    data[i+1] = 255; // G = FF
                    data[i+2] = 0;   // B = 00
                    replaced++;
                }
            }
            ctx.putImageData(imageData, 0, 0);

            return canvas.toDataURL('image/png');
        }

        // ============================================================
        //  জিপ প্রসেস
        // ============================================================
        async function processZip() {
            if (isProcessing) return;
            if (!uploadedZip) {
                alert('প্রথমে একটি জিপ ফাইল আপলোড করুন।');
                return;
            }

            isProcessing = true;
            processBtn.disabled = true;
            downloadBtn.disabled = true;
            processedImages = [];
            processedCount = 0;
            failedCount = 0;
            logContainer.innerHTML = '';
            addLog(`🚀 জিপ প্রসেস শুরু...`, 'info');

            try {
                const zip = await JSZip.loadAsync(uploadedZip);
                const files = Object.keys(zip.files);
                totalFiles = files.length;
                updateStats();

                // ফাইল লিস্ট দেখানো
                fileList.classList.add('show');
                fileListContent.innerHTML = '';
                for (const name of files) {
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    div.innerHTML = `<span class="name">${name}</span>`;
                    fileListContent.appendChild(div);
                }

                let processed = 0;

                for (const [filename, file] of Object.entries(zip.files)) {
                    if (file.dir) continue;

                    // শুধু .png ফাইল নেওয়া
                    if (!filename.toLowerCase().endsWith('.png')) {
                        addLog(`⚠️ ${filename}: শুধু PNG সাপোর্টেড`, 'error');
                        failedCount++;
                        continue;
                    }

                    // Token ID বের করা (465.png → 465)
                    const tokenId = parseInt(filename.replace('.png', ''));
                    if (isNaN(tokenId)) {
                        addLog(`⚠️ ${filename}: Token ID পাওয়া যায়নি`, 'error');
                        failedCount++;
                        continue;
                    }

                    try {
                        const blob = await file.async('blob');
                        const img = await createImageFromBlob(blob);
                        
                        if (!img) {
                            addLog(`❌ #${tokenId}: ইমেজ লোড ব্যর্থ`, 'error');
                            failedCount++;
                            continue;
                        }

                        const dataURL = replaceBackgroundAndGetDataURL(img, tokenId);
                        processedImages.push({ tokenId, dataURL });
                        processedCount++;
                        addLog(`✅ #${tokenId}: সফল`, 'success');

                    } catch (error) {
                        addLog(`❌ #${tokenId}: ${error.message}`, 'error');
                        failedCount++;
                    }

                    processed++;
                    updateProgress(processed, totalFiles);
                    updateStats();
                    statusMsg.textContent = `প্রসেস: ${processed}/${totalFiles}`;
                    
                    // ব্রাউজার ফ্রি রাখতে সামান্য বিরতি
                    await new Promise(r => setTimeout(r, 10));
                }

                addLog(`✅ সম্পন্ন! প্রসেসড: ${processedCount}, ফেইল: ${failedCount}`, 'success');
                statusMsg.textContent = `✅ সম্পন্ন! প্রসেসড: ${processedCount}, ফেইল: ${failedCount}`;
                downloadBtn.disabled = false;

            } catch (error) {
                addLog(`❌ জিপ প্রসেস ব্যর্থ: ${error.message}`, 'error');
                statusMsg.textContent = `❌ ব্যর্থ: ${error.message}`;
            }

            isProcessing = false;
            processBtn.disabled = false;
        }

        // ============================================================
        //  ব্লব থেকে ইমেজ তৈরি
        // ============================================================
        function createImageFromBlob(blob) {
            return new Promise((resolve) => {
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.crossOrigin = 'anonymous';

                const timeout = setTimeout(() => {
                    URL.revokeObjectURL(url);
                    resolve(null);
                }, 10000);

                img.onload = function() {
                    clearTimeout(timeout);
                    URL.revokeObjectURL(url);
                    resolve(img);
                };

                img.onerror = function() {
                    clearTimeout(timeout);
                    URL.revokeObjectURL(url);
                    resolve(null);
                };

                img.src = url;
            });
        }

        // ============================================================
        //  রিপ্লেস করা জিপ ডাউনলোড
        // ============================================================
        async function downloadProcessedZip() {
            if (processedImages.length === 0) {
                alert('কোনো প্রসেসড ছবি নেই।');
                return;
            }

            downloadBtn.disabled = true;
            downloadBtn.textContent = '⏳ জিপ তৈরি হচ্ছে...';

            try {
                const zip = new JSZip();
                const folder = zip.folder('mfer_bg_replaced');

                const batchSize = 50;
                for (let i = 0; i < processedImages.length; i += batchSize) {
                    const batch = processedImages.slice(i, i + batchSize);
                    const blobPromises = batch.map(async (item) => {
                        const response = await fetch(item.dataURL);
                        const blob = await response.blob();
                        return { tokenId: item.tokenId, blob };
                    });

                    const blobResults = await Promise.all(blobPromises);
                    for (const result of blobResults) {
                        folder.file(`${result.tokenId}.png`, result.blob);
                    }

                    const progress = Math.min(i + batchSize, processedImages.length);
                    downloadBtn.textContent = `⏳ ${progress}/${processedImages.length}`;
                }

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                saveAs(zipBlob, 'mfer_bg_replaced.zip');
                downloadBtn.textContent = '✅ ডাউনলোড সম্পূর্ণ!';
                setTimeout(() => {
                    downloadBtn.textContent = '📦 রিপ্লেস করা জিপ ডাউনলোড';
                }, 3000);

            } catch (error) {
                console.error('জিপ তৈরি ব্যর্থ:', error);
                alert('জিপ তৈরি করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
            }

            downloadBtn.disabled = false;
            downloadBtn.textContent = '📦 রিপ্লেস করা জিপ ডাউনলোড';
        }

        // ============================================================
        //  আপলোড ইভেন্ট হ্যান্ডলার
        // ============================================================
        function handleFile(file) {
            if (!file || !file.name.endsWith('.zip')) {
                alert('শুধু .zip ফাইল আপলোড করুন।');
                return;
            }

            uploadedZip = file;
            processBtn.disabled = false;
            addLog(`📄 জিপ আপলোড: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`, 'info');
            statusMsg.textContent = `জিপ আপলোড: ${file.name}`;
        }

        // Drag & Drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            handleFile(file);
        });

        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            handleFile(file);
        });

        // ============================================================
        //  পেজ লোড
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            addLog(`📄 জিপ আপলোড করে প্রসেস করুন। ছবির নাম হতে হবে TOKEN_ID.png`, 'info');
            statusMsg.textContent = 'জিপ আপলোডের অপেক্ষায়...';
        });
    </script>
</body>
</html>
