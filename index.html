        // IPFS Gateway URL (আমরা ipfs.io ব্যবহার করছি)
        const IPFS_GATEWAY = "https://ipfs.io/ipfs/";
        
        let loadedImages = {}; // জিপ তৈরির জন্য ইমেজ ডাটা জমা রাখার অবজেক্ট
        let successCount = 0;
        let failedCount = 0;

        // লগ রাইটার ফাংশন
        function writeLog(text, type = 'info') {
            const logContainer = document.getElementById("logContainer");
            const logLine = document.createElement("div");
            logLine.className = `log-${type}`;
            logLine.innerText = text;
            logContainer.appendChild(logLine);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // ইমেজ লোড করার মূল ফাংশন
        function loadNFTs() {
            document.getElementById("startLoadBtn").disabled = true;
            document.getElementById("totalStats").innerText = NFT_DATA.length;
            
            const gallery = document.getElementById("gallery");
            gallery.innerHTML = ""; // আগের ডাটা পরিষ্কার করা
            
            writeLog("🚀 ইমেজ লোড হওয়া শুরু হয়েছে...", "info");
            document.getElementById("statusMessage").innerText = "ইমেজ লোড হচ্ছে...";

            NFT_DATA.forEach((nft) => {
                const tokenId = nft[0];
                const cid = nft[1];
                const imageUrl = `${IPFS_GATEWAY}${cid}`;

                // গ্যালারির কার্ড তৈরি করা
                const card = document.createElement("div");
                card.className = "nft-card";
                card.onclick = () => openModal(tokenId, imageUrl);

                const img = document.createElement("img");
                img.alt = `mfer #${tokenId}`;
                img.loading = "lazy"; // ব্রাউজার পারফরম্যান্স ঠিক রাখার জন্য

                const label = document.createElement("div");
                label.className = "token-id";
                label.innerText = `#${tokenId}`;

                card.appendChild(img);
                card.appendChild(label);
                gallery.appendChild(card);

                // সরাসরি ইমেজ সোর্স এসাইন করা এবং ট্র্যাক করা
                img.src = imageUrl;

                img.onload = function() {
                    successCount++;
                    document.getElementById("successStats").innerText = successCount;
                    updateProgress();
                    // জিপের জন্য ক্যাশে জমা রাখা
                    fetchAndCacheImage(tokenId, imageUrl);
                };

                img.onerror = function() {
                    failedCount++;
                    document.getElementById("failedStats").innerText = failedCount;
                    img.style.background = "#ff6b6b"; // ফেইল হলে লাল ব্যাকগ্রাউন্ড
                    writeLog(`❌ টোকেন #${tokenId} লোড হতে ব্যর্থ হয়েছে (CID: ${cid})`, "error");
                    updateProgress();
                };
            });
        }

        // প্রোগ্রেস বার এবং পারসেন্টেজ আপডেট
        function updateProgress() {
            const total = NFT_DATA.length;
            const current = successCount + failedCount;
            const percent = Math.round((current / total) * 100);

            document.getElementById("progressBar").style.width = `${percent}%`;
            document.getElementById("progressText").innerText = `${percent}%`;
            document.getElementById("speedIndicator").innerText = `📊 ${percent}%`;

            if (current === total) {
                document.getElementById("statusMessage").innerText = "সম্পন্ন হয়েছে!";
                writeLog(`✅ সমস্ত প্রসেস শেষ! সফল: ${successCount}, ব্যর্থ: ${failedCount}`, "success");
                if (successCount > 0) {
                    document.getElementById("downloadZipBtn").disabled = false;
                }
            }
        }

        // জিপ ফাইলের জন্য ব্লব (Blob) ডাটা সংগ্রহ করা
        async function fetchAndCacheImage(tokenId, url) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                loadedImages[tokenId] = blob;
            } catch (err) {
                console.error(`জিপ ডাটা সংগ্রহ করতে সমস্যা টোকেন: ${tokenId}`, err);
            }
        }

        // জিপ ফাইল ডাউনলোড করার লজিক
        function downloadAllAsZip() {
            const zip = new JSZip();
            writeLog("📦 জিপ ফাইল তৈরি হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...", "info");

            for (const tokenId in loadedImages) {
                zip.file(`mfer_${tokenId}.png`, loadedImages[tokenId]);
            }

            zip.generateAsync({ type: "blob" }).then(function (content) {
                saveAs(content, "mfers_recovery.zip");
                writeLog("🎉 জিপ ডাউনলোড শুরু হয়েছে!", "success");
            });
        }

        // মোডাল পপআপ দেখার জন্য লজিক
        function openModal(tokenId, imageUrl) {
            const modal = document.getElementById("modalOverlay");
            document.getElementById("modalTitle").innerText = `mfer #${tokenId}`;
            modal.classList.add("active");

            const canvas = document.getElementById("modalCanvas");
            const ctx = canvas.getContext("2d");
            const img = new Image();
            img.crossOrigin = "anonymous"; // ক্যানভাসে ড্র করার জন্য পারমিশন
            img.src = imageUrl;

            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };
        }

        function closeModal() {
            document.getElementById("modalOverlay").classList.remove("active");
        }
    </script>
