<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mfer · 10K Ultimate Global Pipeline</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg: #0a0a0b;
            --bg-elevated: #131315;
            --card: #17171a;
            --card-border: #26262a;
            --lime: #D8FF00;
            --lime-dim: #D8FF0022;
            --text: #f2f2ef;
            --text-dim: #8f8f94;
            --error: #ff5470;
            --error-dim: #ff547022;
            --radius-lg: 20px;
            --radius-md: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse 1200px 700px at 50% -10%, #1c1f0c 0%, var(--bg) 55%), var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            padding: 48px 24px 96px;
            min-height: 100vh;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .brand .swatch {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            background: var(--lime);
            box-shadow: 0 0 18px var(--lime-dim), 0 0 4px var(--lime);
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            letter-spacing: -0.02em;
            text-align: center;
            color: var(--text);
        }
        h1 .hash { color: var(--lime); }

        .sub {
            text-align: center;
            color: var(--text-dim);
            margin-top: 10px;
            font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--card-border);
            max-width: 800px;
            margin: 0 auto 32px;
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--bg-elevated);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: var(--radius-md);
            text-align: center;
        }
        .stat-box .label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 6px;
        }
        .stat-box .val {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
        }
        .stat-box.lime-status .val { color: var(--lime); }
        .stat-box.error-status .val { color: var(--error); }

        .controls-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            border: none;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.18s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: var(--lime); color: #0a0a0b; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px #D8FF0044; }
        .btn-secondary { background: var(--bg-elevated); color: var(--text); border: 1px solid var(--card-border); }
        .btn-secondary:hover:not(:disabled) { border-color: var(--text-dim); }
        .btn-danger { background: rgba(255, 84, 112, 0.15); color: var(--error); border: 1px solid var(--error); }
        .btn-danger:hover:not(:disabled) { background: var(--error); color: #fff; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .file-upload-btn {
            position: relative;
            overflow: hidden;
        }
        .file-upload-btn input[type="file"] {
            position: absolute;
            top: 0; left: 0; opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }

        .logger-area {
            background: #060607;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            height: 180px;
            overflow-y: auto;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.6;
        }
        .log-entry { margin-bottom: 4px; display: flex; justify-content: space-between;}
        .log-success { color: var(--lime); }
        .log-error { color: var(--error); }

    </style>
</head>
<body>

    <div class="brand">
        <div class="swatch"></div>
        <h1>mfer <span class="hash">· 10K Pipeline</span></h1>
        <p class="sub">Ultimate Background Replacing Engine</p>
    </div>

    <div class="panel">
        <div class="stats-grid">
            <div class="stat-box">
                <div class="label">Target Items</div>
                <div class="val" id="statTarget">10000</div>
            </div>
            <div class="stat-box">
                <div class="label">Processed</div>
                <div class="val" id="statProcessed">0</div>
            </div>
            <div class="stat-box lime-status">
                <div class="label">Success</div>
                <div class="val" id="statSuccess">0</div>
            </div>
            <div class="stat-box error-status">
                <div class="label">Failed</div>
                <div class="val" id="statFailed">0</div>
            </div>
        </div>

        <div class="controls-row" style="margin-bottom: 20px;">
            <button class="btn btn-primary" id="startBtn" onclick="startGlobalPipeline()">▶️ Start Pipeline</button>
            <button class="btn btn-danger" id="stopBtn" onclick="stopPipeline()" disabled>⏸️ Stop & Export CSV</button>
            <button class="btn btn-secondary" id="downloadZipBtn" onclick="downloadZipArchive()" disabled>📦 Download ZIP Package</button>
            
            <div class="btn btn-secondary file-upload-btn" id="uploadWrapper">
                📁 Upload Failed CSV
                <input type="file" id="csvFileInput" accept=".csv" onchange="handleCSVUpload(event)" />
            </div>
        </div>

        <div class="logger-area" id="logger">
            <div style="color: var(--lime);">[System] Console Initialized. Ready to process.</div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://ipfs.io/ipfs/QmWiQE65tmpYzcokCheQmng2DCM33DEhjXcPB6PanwpAZo';
        const TOTAL_COUNT = 10000;
        const CONCURRENT_LIMIT = 6; 
        const REQUEST_DELAY = 100; 
        const BG_COLOR = '#D8FF00';
        const MAX_RETRY = 2;

        const GATEWAYS = [
            'https://cloudflare-ipfs.com/ipfs',
            'https://ipfs.io/ipfs',
            'https://gateway.pinata.cloud/ipfs'
        ];

        // In-memory runtime cache to bypass storage limit crashes
        let pipelineQueue = [];
        let completedDataMap = new Map(); 
        let failedIdsList = [];
        
        let isPipelineRunning = false;
        let stopRequested = false;
        let currentQueueIndex = 0;
        let isCsvMode = false;

        const statTarget = document.getElementById('statTarget');
        const statProcessed = document.getElementById('statProcessed');
        const statSuccess = document.getElementById('statSuccess');
        const statFailed = document.getElementById('statFailed');
        const logger = document.getElementById('logger');
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const csvFileInput = document.getElementById('csvFileInput');

        // Setup default 1 to 10000 run array
        function resetPipelineToGlobal() {
            pipelineQueue = [];
            for(let i = 1; i <= TOTAL_COUNT; i++) {
                pipelineQueue.push(i);
            }
            statTarget.textContent = pipelineQueue.length;
            isCsvMode = false;
        }
        resetPipelineToGlobal();

        function logToConsole(message, type = '') {
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            div.innerHTML = `<span>[${time}] ${message}</span>`;
            logger.appendChild(div);
            logger.scrollTop = logger.scrollHeight;
        }

        function extractImageCid(metadata) {
            try {
                let data = typeof metadata === 'string' ? JSON.parse(metadata) : metadata;
                if (data.image) {
                    let img = data.image;
                    if (img.startsWith('ipfs://')) return img.replace('ipfs://', '');
                    if (img.startsWith('/ipfs/')) return img.replace('/ipfs/', '');
                    return img.includes('ipfs.io/ipfs/') ? img.split('ipfs.io/ipfs/')[1]?.split('?')[0] : img;
                }
                return null;
            } catch (e) { return null; }
        }

        async function fetchImageAndReplaceBackground(cid, attempt = 0) {
            const gatewayUrl = `${GATEWAYS[attempt % GATEWAYS.length]}/${cid}`;
            try {
                const response = await fetch(gatewayUrl, { signal: AbortSignal.timeout(7000) });
                if (!response.ok) throw new Error();
                const blob = await response.blob();
                
                return new Promise((resolve) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512; canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.fillStyle = BG_COLOR; 
                    ctx.fillRect(0, 0, 512, 512);

                    const img = new Image();
                    const objectURL = URL.createObjectURL(blob);
                    img.src = objectURL;

                    img.onload = function() {
                        const imgAspect = img.width / img.height;
                        let drawW = 512, drawH = 512, offsetX = 0, offsetY = 0;
                        if (imgAspect > 1) {
                            drawH = 512; drawW = 512 * imgAspect; offsetX = (512 - drawW) / 2;
                        } else {
                            drawW = 512; drawH = 512 / imgAspect; offsetY = (512 - drawH) / 2;
                        }
                        
                        const processCanvas = document.createElement('canvas');
                        processCanvas.width = 512; processCanvas.height = 512;
                        const pCtx = processCanvas.getContext('2d');
                        pCtx.drawImage(img, offsetX, offsetY, drawW, drawH);

                        const imageData = pCtx.getImageData(0, 0, 512, 512);
                        const data = imageData.data;
                        
                        const rTarget = data[0];
                        const gTarget = data[1];
                        const bTarget = data[2];

                        for (let j = 0; j < data.length; j += 4) {
                            if (Math.abs(data[j] - rTarget) < 30 && Math.abs(data[j+1] - gTarget) < 30 && Math.abs(data[j+2] - bTarget) < 30) {
                                data[j] = 216;     
                                data[j+1] = 255;   
                                data[j+2] = 0;     
                            }
                        }
                        pCtx.putImageData(imageData, 0, 0);
                        ctx.drawImage(processCanvas, 0, 0);
                        URL.revokeObjectURL(objectURL);
                        resolve({ success: true, blob: null, dataURL: canvas.toDataURL('image/png') });
                    };
                    img.onerror = () => { URL.revokeObjectURL(objectURL); resolve({ success: false }); };
                });
            } catch (err) {
                if (attempt < MAX_RETRY) {
                    return fetchImageAndReplaceBackground(cid, attempt + 1);
                }
                return { success: false };
            }
        }

        async function fetchMetadataWithRetry(tokenId, retries = MAX_RETRY) {
            for (let i = 0; i <= retries; i++) {
                const gatewayBase = i === 0 ? BASE_URL : GATEWAYS[i % GATEWAYS.length] + '/QmWiQE65tmpYzcokCheQmng2DCM33DEhjXcPB6PanwpAZo';
                try {
                    const res = await fetch(`${gatewayBase}/${tokenId}`, { signal: AbortSignal.timeout(5000) });
                    if (!res.ok) throw new Error();
                    return await res.text();
                } catch (err) {
                    if (i === retries) return null;
                    await new Promise(r => setTimeout(r, 200));
                }
            }
        }

        async function processPipelineItem(tokenId) {
            const rawMetadata = await fetchMetadataWithRetry(tokenId);
            let cid = null;
            let result = { success: false };

            if (rawMetadata) {
                cid = extractImageCid(rawMetadata);
                if (cid) result = await fetchImageAndReplaceBackground(cid);
            }

            if (result.success && result.dataURL) {
                completedDataMap.set(tokenId, result.dataURL);
                logToConsole(`mfer #${tokenId} processed successfully.`, 'log-success');
            } else {
                if(!failedIdsList.includes(tokenId)) {
                    failedIdsList.push(tokenId);
                }
                logToConsole(`mfer #${tokenId} failed to load from IPFS.`, 'log-error');
            }

            // Update DOM metrics live
            statProcessed.textContent = completedDataMap.size + failedIdsList.length;
            statSuccess.textContent = completedDataMap.size;
            statFailed.textContent = failedIdsList.length;
        }

        async function startGlobalPipeline() {
            if (isPipelineRunning) return;
            isPipelineRunning = true;
            stopRequested = false;

            startBtn.disabled = true;
            stopBtn.disabled = false;
            downloadZipBtn.disabled = true;
            document.getElementById('uploadWrapper').style.opacity = '0.3';
            csvFileInput.disabled = true;

            logToConsole(`Pipeline started. Processing queue...`, 'log-success');

            const worker = async () => {
                while (currentQueueIndex < pipelineQueue.length && !stopRequested) {
                    const id = pipelineQueue[currentQueueIndex++];
                    
                    // Skip if already in successful memory map
                    if (completedDataMap.has(id)) continue;

                    await processPipelineItem(id);
                    await new Promise(r => setTimeout(r, REQUEST_DELAY));
                }
            };

            const pool = Array(CONCURRENT_LIMIT).fill(null).map(() => worker());
            await Promise.all(pool);

            isPipelineRunning = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            downloadZipBtn.disabled = completedDataMap.size === 0;
            document.getElementById('uploadWrapper').style.opacity = '1';
            csvFileInput.disabled = false;

            if (stopRequested) {
                logToConsole(`Pipeline paused by user. Exporting failed manifest...`, 'log-error');
                triggerCsvDownload();
            } else {
                logToConsole(`Pipeline job complete. Stored items: ${completedDataMap.size}`, 'log-success');
                if(failedIdsList.length > 0) {
                    triggerCsvDownload();
                }
            }
        }

        function stopPipeline() {
            stopRequested = true;
            logToConsole('Stop signal sent. Gracefully halting active threads...');
        }

        function triggerCsvDownload() {
            if (failedIdsList.length === 0) {
                alert("No failed items detected in this run!");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Failed_Token_ID\n" + failedIdsList.join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", isCsvMode ? "retry_failed_items.csv" : "global_failed_items.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r?\n/);
                const loadedIds = [];

                for (let i = 1; i < lines.length; i++) {
                    const val = lines[i].trim();
                    if (val && !isNaN(val)) {
                        loadedIds.push(parseInt(val));
                    }
                }

                if (loadedIds.length > 0) {
                    pipelineQueue = loadedIds;
                    currentQueueIndex = 0;
                    failedIdsList = []; // Clear old fails for fresh session
                    isCsvMode = true;

                    // Reset counters for CSV targeted tracking
                    statTarget.textContent = pipelineQueue.length;
                    statProcessed.textContent = "0";
                    statSuccess.textContent = completedDataMap.size; // show current global map size
                    statFailed.textContent = "0";

                    logToConsole(`CSV Uploaded! Loaded ${loadedIds.length} target tokens for retry pipeline. Click 'Start Pipeline'`, 'log-success');
                } else {
                    alert("Invalid CSV format or empty list.");
                }
            };
            reader.readAsText(file);
        }

        async function downloadZipArchive() {
            downloadZipBtn.disabled = true;
            const originalText = downloadZipBtn.textContent;
            downloadZipBtn.textContent = '📦 Packing ZIP (Please Wait)...';

            try {
                const zip = new JSZip();
                const folder = zip.folder(isCsvMode ? "mfer_csv_retry_batch" : "mfer_global_export");

                let indexCounter = 1;
                for (const [id, dataURL] of completedDataMap.entries()) {
                    const res = await fetch(dataURL);
                    const blob = await res.blob();
                    
                    // Uses exact original serial mapping
                    folder.file(`${id}.png`, blob);
                    indexCounter++;
                }

                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, isCsvMode ? "mfer_retry_fixed.zip" : "mfer_processed_global.zip");
                logToConsole("ZIP exported successfully.", 'log-success');
            } catch (e) {
                alert("Compression error.");
            }

            downloadZipBtn.textContent = originalText;
            downloadZipBtn.disabled = false;
        }
    </script>
</body>
</html>
