<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mfer · 10K Advanced CORS-Safe Retry Pipeline</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg: #0a0a0b;
            --bg-elevated: #131315;
            --card: #17171a;
            --card-border: #26262a;
            --lime: #D8FF00;
            --lime-dim: #D8FF0022;
            --text: #f2f2ef;
            --text-dim: #8f8f94;
            --error: #ff5470;
            --error-dim: #ff547022;
            --radius-lg: 20px;
            --radius-md: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse 1200px 700px at 50% -10%, #1c1f0c 0%, var(--bg) 55%), var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            padding: 48px 24px 96px;
            min-height: 100vh;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .brand .swatch {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            background: var(--lime);
            box-shadow: 0 0 18px var(--lime-dim), 0 0 4px var(--lime);
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            letter-spacing: -0.02em;
            text-align: center;
            color: var(--text);
        }
        h1 .hash { color: var(--lime); }

        .sub {
            text-align: center;
            color: var(--text-dim);
            margin-top: 10px;
            font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--card-border);
            max-width: 800px;
            margin: 0 auto 32px;
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--bg-elevated);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: var(--radius-md);
            text-align: center;
        }
        .stat-box .label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 6px;
        }
        .stat-box .val {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
        }
        .stat-box.lime-status .val { color: var(--lime); }
        .stat-box.error-status .val { color: var(--error); }

        .controls-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            border: none;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.18s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: var(--lime); color: #0a0a0b; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px #D8FF0044; }
        .btn-secondary { background: var(--bg-elevated); color: var(--text); border: 1px solid var(--card-border); }
        .btn-secondary:hover:not(:disabled) { border-color: var(--text-dim); }
        .btn-danger { background: rgba(255, 84, 112, 0.15); color: var(--error); border: 1px solid var(--error); }
        .btn-danger:hover:not(:disabled) { background: var(--error); color: #fff; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .file-upload-btn {
            position: relative;
            overflow: hidden;
            background: #1c1f0c;
            border-color: var(--lime);
            color: var(--lime);
        }
        .file-upload-btn input[type="file"] {
            position: absolute;
            top: 0; left: 0; opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }

        .logger-area {
            background: #060607;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            height: 220px;
            overflow-y: auto;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.6;
        }
        .log-entry { margin-bottom: 4px; display: flex; justify-content: space-between;}
        .log-success { color: var(--lime); }
        .log-error { color: var(--error); }
        .log-info { color: #54b2ff; }

    </style>
</head>
<body>

    <div class="brand">
        <div class="swatch"></div>
        <h1>mfer <span class="hash">· Smart CORS-Safe Pipeline</span></h1>
        <p class="sub">Direct Native Image Engine (GitHub Pages Approved)</p>
    </div>

    <div class="panel">
        <div class="stats-grid">
            <div class="stat-box">
                <div class="label">CSV Target Items</div>
                <div class="val" id="statTarget">0</div>
            </div>
            <div class="stat-box">
                <div class="label">Processed</div>
                <div class="val" id="statProcessed">0</div>
            </div>
            <div class="stat-box lime-status">
                <div class="label">Fixed Success</div>
                <div class="val" id="statSuccess">0</div>
            </div>
            <div class="stat-box error-status">
                <div class="label">Still Failed</div>
                <div class="val" id="statFailed">0</div>
            </div>
        </div>

        <div class="controls-row" style="margin-bottom: 20px;">
            <div class="btn btn-secondary file-upload-btn" id="uploadWrapper">
                📁 Step 1: Upload Failed CSV
                <input type="file" id="csvFileInput" accept=".csv" onchange="handleCSVUpload(event)" />
            </div>
            <button class="btn btn-primary" id="startBtn" onclick="startRetryPipeline()" disabled>▶️ Step 2: Start Retry</button>
            <button class="btn btn-danger" id="stopBtn" onclick="stopPipeline()" disabled>⏸️ Stop & Export Remaining</button>
            <button class="btn btn-secondary" id="downloadZipBtn" onclick="downloadZipArchive()" disabled>📦 Step 3: Download Fixed ZIP</button>
        </div>

        <div class="logger-area" id="logger">
            <div style="color: var(--lime);">[System] Pipeline Ready. Upload the CSV to begin the bypass operation.</div>
        </div>
    </div>

    <script>
        const CID_METADATA_FOLDER = 'QmWiQE65tmpYzcokCheQmng2DCM33DEhjXcPB6PanwpAZo';
        const CONCURRENT_LIMIT = 4; 
        const REQUEST_DELAY = 200; 
        const BG_COLOR = '#D8FF00';
        const MAX_RETRY_ATTEMPTS = 4;

        // Optimized gateways prioritizing metadata and asset loading
        const METADATA_GATEWAYS = [
            'https://ipfs.io/ipfs',
            'https://cloudflare-ipfs.com/ipfs',
            'https://gateway.pinata.cloud/ipfs'
        ];

        const IMAGE_GATEWAYS = [
            'https://ipfs.io/ipfs',
            'https://cloudflare-ipfs.com/ipfs',
            'https://gateway.pinata.cloud/ipfs',
            'https://dweb.link/ipfs'
        ];

        let pipelineQueue = [];
        let completedDataMap = new Map(); 
        let currentFailedList = [];
        
        let isPipelineRunning = false;
        let stopRequested = false;
        let currentQueueIndex = 0;

        const statTarget = document.getElementById('statTarget');
        const statProcessed = document.getElementById('statProcessed');
        const statSuccess = document.getElementById('statSuccess');
        const statFailed = document.getElementById('statFailed');
        const logger = document.getElementById('logger');
        
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const csvFileInput = document.getElementById('csvFileInput');

        function logToConsole(message, type = '') {
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            div.innerHTML = `<span>[${time}] ${message}</span>`;
            logger.appendChild(div);
            logger.scrollTop = logger.scrollHeight;
        }

        function extractImageCid(metadata) {
            try {
                let data = typeof metadata === 'string' ? JSON.parse(metadata) : metadata;
                if (data.image) {
                    let img = data.image;
                    if (img.startsWith('ipfs://')) return img.replace('ipfs://', '');
                    if (img.startsWith('/ipfs/')) return img.replace('/ipfs/', '');
                    return img.includes('ipfs.io/ipfs/') ? img.split('ipfs.io/ipfs/')[1]?.split('?')[0] : img;
                }
                return null;
            } catch (e) { return null; }
        }

        // Native CORS Bypass Image Core Engine
        async function fetchImageWithFallbackNative(cid, attempt = 0) {
            const currentGateway = IMAGE_GATEWAYS[attempt % IMAGE_GATEWAYS.length];
            const gatewayUrl = `${currentGateway}/${cid}`;
            
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous"; // Bypass strict API cross-origin blocks
                
                // Safety Timeout handling for slow gateways
                const timeoutId = setTimeout(() => {
                    img.src = ""; // Abort load
                    handleFail();
                }, 8000);

                async function handleFail() {
                    clearTimeout(timeoutId);
                    if (attempt < MAX_RETRY_ATTEMPTS) {
                        logToConsole(`🔄 Switching Gateway for CID: ${cid.substring(0,8)}...`, 'log-info');
                        const retryRes = await fetchImageWithFallbackNative(cid, attempt + 1);
                        resolve(retryRes);
                    } else {
                        resolve({ success: false });
                    }
                }

                img.onload = function() {
                    clearTimeout(timeoutId);
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = 512; canvas.height = 512;
                        const ctx = canvas.getContext('2d');
                        
                        ctx.fillStyle = BG_COLOR; 
                        ctx.fillRect(0, 0, 512, 512);

                        const imgAspect = img.width / img.height;
                        let drawW = 512, drawH = 512, offsetX = 0, offsetY = 0;
                        if (imgAspect > 1) {
                            drawH = 512; drawW = 512 * imgAspect; offsetX = (512 - drawW) / 2;
                        } else {
                            drawW = 512; drawH = 512 / imgAspect; offsetY = (512 - drawH) / 2;
                        }
                        
                        const processCanvas = document.createElement('canvas');
                        processCanvas.width = 512; processCanvas.height = 512;
                        const pCtx = processCanvas.getContext('2d');
                        pCtx.drawImage(img, offsetX, offsetY, drawW, drawH);

                        const imageData = pCtx.getImageData(0, 0, 512, 512);
                        const data = imageData.data;
                        
                        const rTarget = data[0];
                        const gTarget = data[1];
                        const bTarget = data[2];

                        for (let j = 0; j < data.length; j += 4) {
                            if (Math.abs(data[j] - rTarget) < 30 && Math.abs(data[j+1] - gTarget) < 30 && Math.abs(data[j+2] - bTarget) < 30) {
                                data[j] = 216;     
                                data[j+1] = 255;   
                                data[j+2] = 0;     
                            }
                        }
                        pCtx.putImageData(imageData, 0, 0);
                        ctx.drawImage(processCanvas, 0, 0);
                        resolve({ success: true, dataURL: canvas.toDataURL('image/png') });
                    } catch (e) {
                        // Triggers if image gateway returns dirty canvas headers
                        handleFail();
                    }
                };

                img.onerror = () => handleFail();
                img.src = gatewayUrl;
            });
        }

        async function fetchMetadataWithFallback(tokenId, attempt = 0) {
            const currentGateway = METADATA_GATEWAYS[attempt % METADATA_GATEWAYS.length];
            const targetUrl = `${currentGateway}/${CID_METADATA_FOLDER}/${tokenId}`;
            
            try {
                const res = await fetch(targetUrl, { signal: AbortSignal.timeout(6000) });
                if (!res.ok) throw new Error();
                return await res.text();
            } catch (err) {
                if (attempt < MAX_RETRY_ATTEMPTS) {
                    return fetchMetadataWithFallback(tokenId, attempt + 1);
                }
                return null;
            }
        }

        async function processPipelineItem(tokenId) {
            const rawMetadata = await fetchMetadataWithFallback(tokenId);
            let cid = null;
            let result = { success: false };

            if (rawMetadata) {
                cid = extractImageCid(rawMetadata);
                if (cid) result = await fetchImageWithFallbackNative(cid);
            }

            if (result.success && result.dataURL) {
                completedDataMap.set(tokenId, result.dataURL);
                logToConsole(`⚡ Fixed: mfer #${tokenId} processed successfully.`, 'log-success');
            } else {
                if(!currentFailedList.includes(tokenId)) {
                    currentFailedList.push(tokenId);
                }
                logToConsole(`❌ Failed: mfer #${tokenId} blocked or unavailable.`, 'log-error');
            }

            statProcessed.textContent = completedDataMap.size + currentFailedList.length;
            statSuccess.textContent = completedDataMap.size;
            statFailed.textContent = currentFailedList.length;
        }

        async function startRetryPipeline() {
            if (isPipelineRunning || pipelineQueue.length === 0) return;
            isPipelineRunning = true;
            stopRequested = false;

            startBtn.disabled = true;
            stopBtn.disabled = false;
            downloadZipBtn.disabled = true;
            csvFileInput.disabled = true;

            logToConsole(`Executing Native Bypass Runner for ${pipelineQueue.length} items...`, 'log-success');

            const worker = async () => {
                while (currentQueueIndex < pipelineQueue.length && !stopRequested) {
                    const id = pipelineQueue[currentQueueIndex++];
                    
                    if (completedDataMap.has(id)) continue;

                    await processPipelineItem(id);
                    await new Promise(r => setTimeout(r, REQUEST_DELAY));
                }
            };

            const pool = Array(CONCURRENT_LIMIT).fill(null).map(() => worker());
            await Promise.all(pool);

            isPipelineRunning = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            downloadZipBtn.disabled = completedDataMap.size === 0;
            csvFileInput.disabled = false;

            if (stopRequested) {
                logToConsole(`Pipeline paused. Exporting remaining fail log...`, 'log-error');
                triggerCsvDownload();
            } else {
                logToConsole(`Pipeline finished processing. Recovered: ${completedDataMap.size}`, 'log-success');
                if(currentFailedList.length > 0) {
                    triggerCsvDownload();
                }
            }
        }

        function stopPipeline() {
            stopRequested = true;
            logToConsole('Stopping active workers safely...');
        }

        function triggerCsvDownload() {
            if (currentFailedList.length === 0) return;
            let csvContent = "data:text/csv;charset=utf-8,Failed_Token_ID\n" + currentFailedList.join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "still_failed_tokens.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r?\n/);
                const loadedIds = [];

                for (let i = 1; i < lines.length; i++) {
                    const val = lines[i].trim();
                    if (val && !isNaN(val)) {
                        loadedIds.push(parseInt(val));
                    }
                }

                if (loadedIds.length > 0) {
                    pipelineQueue = loadedIds;
                    currentQueueIndex = 0;
                    currentFailedList = []; 
                    completedDataMap.clear(); 

                    statTarget.textContent = pipelineQueue.length;
                    statProcessed.textContent = "0";
                    statSuccess.textContent = "0";
                    statFailed.textContent = "0";

                    startBtn.disabled = false;
                    logToConsole(`CSV Uploaded! Loaded ${loadedIds.length} Token IDs. Ready for bypass run.`, 'log-success');
                } else {
                    alert("Invalid CSV format.");
                }
            };
            reader.readAsText(file);
        }

        async function downloadZipArchive() {
            downloadZipBtn.disabled = true;
            const originalText = downloadZipBtn.textContent;
            downloadZipBtn.textContent = '📦 Building ZIP...';

            try {
                const zip = new JSZip();
                const folder = zip.folder("mfer_fixed_retry_images");

                for (const [id, dataURL] of completedDataMap.entries()) {
                    const res = await fetch(dataURL);
                    const blob = await res.blob();
                    folder.file(`${id}.png`, blob);
                }

                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, "mfer_recovered_fixed_batch.zip");
                logToConsole("Fixed ZIP exported successfully!", 'log-success');
            } catch (e) {
                alert("Error creating ZIP.");
            }

            downloadZipBtn.textContent = originalText;
            downloadZipBtn.disabled = false;
        }
    </script>
</body>
</html>
