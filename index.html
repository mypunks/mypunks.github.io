<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mfer · #D8FF00 Smart Batch Downloader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg: #0a0a0b;
            --bg-elevated: #131315;
            --card: #17171a;
            --card-border: #26262a;
            --lime: #D8FF00;
            --lime-dim: #D8FF0022;
            --text: #f2f2ef;
            --text-dim: #8f8f94;
            --error: #ff5470;
            --error-dim: #ff547022;
            --radius-lg: 20px;
            --radius-md: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse 1200px 700px at 50% -10%, #1c1f0c 0%, var(--bg) 55%), var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            padding: 48px 24px 96px;
            min-height: 100vh;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .brand .swatch {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            background: var(--lime);
            box-shadow: 0 0 18px var(--lime-dim), 0 0 4px var(--lime);
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            letter-spacing: -0.02em;
            text-align: center;
            color: var(--text);
        }

        h1 .hash { color: var(--lime); }

        .sub {
            text-align: center;
            color: var(--text-dim);
            margin-top: 10px;
            font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sub .count-pill {
            background: var(--bg-elevated);
            border: 1px solid var(--card-border);
            color: var(--lime);
            padding: 3px 12px;
            border-radius: 30px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 44px;
            flex-wrap: wrap;
            align-items: center;
        }

        .select-input {
            background: var(--bg-elevated);
            color: var(--text);
            border: 1px solid var(--card-border);
            padding: 12px 20px;
            border-radius: 40px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .select-input:focus {
            border-color: var(--lime);
        }

        .btn {
            border: none;
            font-weight: 600;
            padding: 13px 28px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
            letter-spacing: 0.01em;
        }

        .btn-primary {
            background: var(--lime);
            color: #0a0a0b;
            box-shadow: 0 0 0 1px #D8FF0033, 0 8px 24px -6px #D8FF0055;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 0 1px #D8FF0055, 0 14px 30px -6px #D8FF0077;
        }
        .btn-primary:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .btn-danger {
            background: transparent;
            color: var(--error);
            border: 1px solid var(--error);
            box-shadow: 0 0 10px var(--error-dim);
        }
        .btn-danger:hover:not(:disabled) {
            background: var(--error);
            color: #fff;
            transform: translateY(-2px);
        }
        .btn-danger:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .nft-card {
            background: var(--card);
            border-radius: var(--radius-md);
            padding: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            text-align: center;
            border: 1px solid var(--card-border);
            cursor: pointer;
            position: relative;
        }
        .nft-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px -12px rgba(216, 255, 0, 0.18);
            border-color: var(--lime);
            z-index: 2;
        }
        .nft-card.is-error-card { border-color: rgba(255, 84, 112, 0.4); }
        .nft-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            background: var(--lime);
        }
        .nft-card .token-id {
            color: var(--lime);
            font-weight: 600;
            margin-top: 8px;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-elevated);
            padding: 3px 10px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid #D8FF0022;
        }
        .nft-card .status-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--error);
            color: #fff;
            font-size: 0.62rem;
            font-weight: 600;
            padding: 2px 9px;
            border-radius: 20px;
            opacity: 0;
        }
        .nft-card .status-badge.show { opacity: 1; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(6, 6, 7, 0.9);
            backdrop-filter: blur(8px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--bg-elevated);
            border-radius: var(--radius-lg);
            padding: 22px;
            border: 1px solid var(--card-border);
            max-width: 560px;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .modal-content .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 1.8rem;
            color: var(--text-dim);
            cursor: pointer;
            background: none;
            border: none;
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 512px;
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            background: var(--lime);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        .canvas-wrapper canvas { width: 100% !important; height: 100% !important; }
        .modal-retry-area { display: none; justify-content: center; }
        .modal-retry-area.show { display: flex; }

        .status-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(10, 10, 11, 0.85);
            backdrop-filter: blur(10px);
            color: var(--text-dim);
            padding: 12px 24px;
            text-align: center;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            border-top: 1px solid var(--card-border);
            z-index: 999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .status-bar span { background: var(--bg-elevated); border: 1px solid var(--card-border); padding: 3px 14px; border-radius: 30px; }
        .status-bar .highlight { color: var(--lime); font-weight: 600; }
        .status-bar .failed-highlight { color: var(--error); font-weight: 600; }

        @media (max-width: 1100px) { .gallery { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 800px) { .gallery { grid-template-columns: repeat(3, 1fr); gap: 12px; } }
        @media (max-width: 520px) { .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; } }
    </style>
</head>
<body>

    <div class="brand">
        <div class="swatch"></div>
        <h1>mfer <span class="hash">· Smart Batch</span></h1>
        <p class="sub">Divided into groups of 500 <span class="count-pill">Total 10,000</span></p>
    </div>

    <div class="controls">
        <select class="select-input" id="batchSelect" onchange="changeBatch()">
            <!-- Dynamic Options -->
        </select>
        <button class="btn btn-primary" id="downloadBatchBtn" onclick="downloadCurrentBatchAsZip()">Download Current Batch ZIP</button>
        <button class="btn btn-danger" id="retryFailedBtn" onclick="retryAllFailedInBatch()" disabled>Retry Failed In Batch (0)</button>
        <button class="btn btn-danger" style="border-color: #666; color: #aaa;" onclick="clearSavedCache()">Clear Cache</button>
    </div>

    <div class="gallery" id="gallery"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeModalBtn" onclick="closeModal()">&times;</button>
            <div class="modal-title" id="modalTitle">#1</div>
            <div class="canvas-wrapper">
                <canvas id="modalCanvas" width="512" height="512"></canvas>
            </div>
            <div class="modal-retry-area" id="modalRetryArea">
                <button class="btn btn-primary" style="background:var(--error); color:#fff; box-shadow:none;" id="singleRetryBtn">🔄 Retry This Item</button>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
        <span>Current Range: <span id="rangeLabel" class="highlight">1 - 500</span></span>
        <span>Batch Loaded: <span id="loadedCount" class="highlight">0</span> / 500</span>
        <span>Batch Failed: <span id="failedCount" class="failed-highlight">0</span></span>
        <span id="statusMessage">Pipeline Ready</span>
    </div>

    <script>
        const BASE_URL = 'https://ipfs.io/ipfs/QmWiQE65tmpYzcokCheQmng2DCM33DEhjXcPB6PanwpAZo';
        const TOTAL = 10000;
        const BATCH_SIZE = 500;
        const CONCURRENT_LIMIT = 5; 
        const REQUEST_DELAY = 120; 
        const BG_COLOR = '#D8FF00';
        const MAX_RETRY = 3;

        const GATEWAYS = [
            'https://cloudflare-ipfs.com/ipfs',
            'https://ipfs.io/ipfs',
            'https://gateway.pinata.cloud/ipfs'
        ];

        let nftDataStore = new Array(TOTAL + 1).fill(null);
        let currentBatchStart = 1;
        let currentBatchEnd = 500;
        let isBatchRunning = false;
        let activeModalTokenId = null;

        const batchSelect = document.getElementById('batchSelect');
        const gallery = document.getElementById('gallery');
        const loadedSpan = document.getElementById('loadedCount');
        const failedSpan = document.getElementById('failedCount');
        const rangeLabel = document.getElementById('rangeLabel');
        const statusMsg = document.getElementById('statusMessage');
        const downloadBatchBtn = document.getElementById('downloadBatchBtn');
        const retryFailedBtn = document.getElementById('retryFailedBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalCanvas = document.getElementById('modalCanvas');
        const modalTitle = document.getElementById('modalTitle');
        const modalRetryArea = document.getElementById('modalRetryArea');
        const singleRetryBtn = document.getElementById('singleRetryBtn');

        // Load Persistent Saved Batch from localStorage on startup
        function initDropdown() {
            batchSelect.innerHTML = '';
            const savedBatch = localStorage.getItem('mfer_current_batch_start');
            if (savedBatch) {
                currentBatchStart = parseInt(savedBatch);
                currentBatchEnd = currentBatchStart + BATCH_SIZE - 1;
            }

            for (let i = 1; i <= TOTAL; i += BATCH_SIZE) {
                let start = i;
                let end = i + BATCH_SIZE - 1;
                let opt = document.createElement('option');
                opt.value = start;
                opt.textContent = `Batch: ${start} - ${end}`;
                if (start === currentBatchStart) opt.selected = true;
                batchSelect.appendChild(opt);
            }
        }

        // Load Single NFT Data from Cache
        function loadFromLocalStorageCache(tokenId) {
            const cached = localStorage.getItem(`mfer_cache_${tokenId}`);
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    if (parsed && parsed.dataURL && !parsed.isError) {
                        nftDataStore[tokenId] = parsed;
                        return true;
                    }
                } catch(e) {}
            }
            return false;
        }

        function saveToLocalStorageCache(tokenId, dataObj) {
            if (!dataObj.isError) {
                try {
                    localStorage.setItem(`mfer_cache_${tokenId}`, JSON.stringify(dataObj));
                } catch (e) {
                    // If localStorage fills up completely, clear older items gracefully
                    console.log("Storage filled, clean up initiated.");
                }
            }
        }

        function clearSavedCache() {
            if(confirm("Do you want to clear all loaded image cache?")) {
                for (let i = 1; i <= TOTAL; i++) {
                    localStorage.removeItem(`mfer_cache_${i}`);
                }
                localStorage.removeItem('mfer_current_batch_start');
                location.reload();
            }
        }

        function extractImageCid(metadata) {
            try {
                let data = typeof metadata === 'string' ? JSON.parse(metadata) : metadata;
                if (data.image) {
                    let img = data.image;
                    if (img.startsWith('ipfs://')) return img.replace('ipfs://', '');
                    if (img.startsWith('/ipfs/')) return img.replace('/ipfs/', '');
                    return img.includes('ipfs.io/ipfs/') ? img.split('ipfs.io/ipfs/')[1]?.split('?')[0] : img;
                }
                return null;
            } catch (e) { return null; }
        }

        async function fetchImageAndReplaceBackground(cid, attempt = 0) {
            const gatewayUrl = `${GATEWAYS[attempt % GATEWAYS.length]}/${cid}`;
            try {
                const response = await fetch(gatewayUrl, { signal: AbortSignal.timeout(8000) });
                if (!response.ok) throw new Error();
                const blob = await response.blob();
                
                return new Promise((resolve) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 512; canvas.height = 512;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.fillStyle = BG_COLOR; 
                    ctx.fillRect(0, 0, 512, 512);

                    const img = new Image();
                    const objectURL = URL.createObjectURL(blob);
                    img.src = objectURL;

                    img.onload = function() {
                        const imgAspect = img.width / img.height;
                        let drawW = 512, drawH = 512, offsetX = 0, offsetY = 0;
                        if (imgAspect > 1) {
                            drawH = 512; drawW = 512 * imgAspect; offsetX = (512 - drawW) / 2;
                        } else {
                            drawW = 512; drawH = 512 / imgAspect; offsetY = (512 - drawH) / 2;
                        }
                        
                        const processCanvas = document.createElement('canvas');
                        processCanvas.width = 512; processCanvas.height = 512;
                        const pCtx = processCanvas.getContext('2d');
                        pCtx.drawImage(img, offsetX, offsetY, drawW, drawH);

                        const imageData = pCtx.getImageData(0, 0, 512, 512);
                        const data = imageData.data;
                        
                        const rTarget = data[0];
                        const gTarget = data[1];
                        const bTarget = data[2];

                        for (let j = 0; j < data.length; j += 4) {
                            if (Math.abs(data[j] - rTarget) < 30 && Math.abs(data[j+1] - gTarget) < 30 && Math.abs(data[j+2] - bTarget) < 30) {
                                data[j] = 216;     
                                data[j+1] = 255;   
                                data[j+2] = 0;     
                            }
                        }
                        pCtx.putImageData(imageData, 0, 0);
                        
                        ctx.drawImage(processCanvas, 0, 0);
                        URL.revokeObjectURL(objectURL);
                        resolve({ success: true, dataURL: canvas.toDataURL('image/png') });
                    };
                    img.onerror = () => { URL.revokeObjectURL(objectURL); resolve({ success: false }); };
                });
            } catch (err) {
                if (attempt < MAX_RETRY) {
                    await new Promise(r => setTimeout(r, 300));
                    return fetchImageAndReplaceBackground(cid, attempt + 1);
                }
                return { success: false };
            }
        }

        async function fetchMetadataWithRetry(tokenId, retries = MAX_RETRY) {
            for (let i = 0; i <= retries; i++) {
                const gatewayBase = i === 0 ? BASE_URL : GATEWAYS[i % GATEWAYS.length] + '/QmWiQE65tmpYzcokCheQmng2DCM33DEhjXcPB6PanwpAZo';
                try {
                    const res = await fetch(`${gatewayBase}/${tokenId}`, { signal: AbortSignal.timeout(6000) });
                    if (!res.ok) throw new Error();
                    return await res.text();
                } catch (err) {
                    if (i === retries) return null;
                    await new Promise(r => setTimeout(r, 400));
                }
            }
        }

        async function processSingleNFT(tokenId) {
            // If already stored or available in storage cache, use it immediately
            if (loadFromLocalStorageCache(tokenId)) {
                updateCardUI(tokenId);
                updateBatchCounters();
                return nftDataStore[tokenId];
            }

            const rawMetadata = await fetchMetadataWithRetry(tokenId);
            let cid = null;
            let result = { success: false };

            if (rawMetadata) {
                cid = extractImageCid(rawMetadata);
                if (cid) result = await fetchImageAndReplaceBackground(cid);
            }

            let finalDataURL = result.dataURL;
            if (!result.success) {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = BG_COLOR; ctx.fillRect(0, 0, 512, 512);
                ctx.fillStyle = '#17171a'; ctx.font = 'bold 24px monospace'; ctx.textAlign = 'center';
                ctx.fillText(`mfer #${tokenId}`, 256, 240);
                ctx.font = '16px monospace'; ctx.fillStyle = '#ff5470';
                ctx.fillText('⚠️ Gateway Timeout', 256, 280);
                finalDataURL = canvas.toDataURL('image/png');
            }

            const targetData = { tokenId, dataURL: finalDataURL, isError: !result.success };
            nftDataStore[tokenId] = targetData;
            
            // Save to browser database cache if successful
            saveToLocalStorageCache(tokenId, targetData);

            updateCardUI(tokenId);
            updateBatchCounters();
            return nftDataStore[tokenId];
        }

        function updateCardUI(tokenId) {
            const item = nftDataStore[tokenId];
            let card = document.querySelector(`.nft-card[data-token-id="${tokenId}"]`);
            if (!card) return;

            const img = card.querySelector('img');
            const badge = card.querySelector('.status-badge');

            img.src = item.dataURL;
            if (item.isError) {
                card.classList.add('is-error-card');
                badge.style.opacity = 1;
            } else {
                card.classList.remove('is-error-card');
                badge.style.opacity = 0;
            }
        }

        function updateBatchCounters() {
            let loaded = 0, failed = 0;
            for (let i = currentBatchStart; i <= currentBatchEnd; i++) {
                if (!nftDataStore[i]) {
                    loadFromLocalStorageCache(i);
                }
                if (nftDataStore[i]) {
                    if (nftDataStore[i].isError) failed++;
                    else loaded++;
                }
            }
            loadedSpan.textContent = loaded;
            failedSpan.textContent = failed;
            retryFailedBtn.disabled = failed === 0;
            retryFailedBtn.textContent = `Retry Failed In Batch (${failed})`;
        }

        async function changeBatch() {
            if (isBatchRunning) return;
            currentBatchStart = parseInt(batchSelect.value);
            currentBatchEnd = currentBatchStart + BATCH_SIZE - 1;
            rangeLabel.textContent = `${currentBatchStart} - ${currentBatchEnd}`;

            // Save active batch range configuration to browser state
            localStorage.setItem('mfer_current_batch_start', currentBatchStart);

            gallery.innerHTML = '';
            for (let i = currentBatchStart; i <= currentBatchEnd; i++) {
                const card = document.createElement('div');
                card.className = 'nft-card';
                card.dataset.tokenId = i;
                card.innerHTML = `<img><div class="token-id">#${i}</div><div class="status-badge">⚠️</div>`;
                card.addEventListener('click', () => openModal(i));
                gallery.appendChild(card);
            }

            for (let i = currentBatchStart; i <= currentBatchEnd; i++) {
                loadFromLocalStorageCache(i);
                if (nftDataStore[i]) updateCardUI(i);
            }
            updateBatchCounters();

            await startBatchPipeline();
        }

        async function startBatchPipeline() {
            if (isBatchRunning) return;
            isBatchRunning = true;
            downloadBatchBtn.disabled = true;
            statusMsg.textContent = "Loading current batch...";

            let index = currentBatchStart;
            const queueWorker = async () => {
                while (index <= currentBatchEnd) {
                    const currentId = index++;
                    if (currentId > currentBatchEnd) break;

                    // Skip network pull if already loaded successfully in structural memory
                    if (nftDataStore[currentId] && !nftDataStore[currentId].isError) continue;
                    if (loadFromLocalStorageCache(currentId)) continue;

                    await new Promise(r => setTimeout(r, REQUEST_DELAY));
                    await processSingleNFT(currentId);
                }
            };

            const workers = Array(CONCURRENT_LIMIT).fill(null).map(() => queueWorker());
            await Promise.all(workers);

            isBatchRunning = false;
            downloadBatchBtn.disabled = false;
            statusMsg.textContent = "Batch ready for export.";
            updateBatchCounters();
        }

        async function retrySingleItem(tokenId) {
            singleRetryBtn.disabled = true;
            localStorage.removeItem(`mfer_cache_${tokenId}`); // clear explicit error cache
            const item = await processSingleNFT(tokenId);
            
            const ctx = modalCanvas.getContext('2d');
            const img = new Image();
            img.onload = () => { ctx.clearRect(0,0,512,512); ctx.drawImage(img,0,0,512,512); };
            img.src = item.dataURL;

            if (!item.isError) modalRetryArea.classList.remove('show');
            singleRetryBtn.disabled = false;
        }

        async function retryAllFailedInBatch() {
            if (isBatchRunning) return;
            isBatchRunning = true;
            retryFailedBtn.disabled = true;

            let failedIds = [];
            for (let i = currentBatchStart; i <= currentBatchEnd; i++) {
                if (nftDataStore[i] && nftDataStore[i].isError) {
                    failedIds.push(i);
                    localStorage.removeItem(`mfer_cache_${i}`);
                }
            }

            let poolIndex = 0;
            const queueWorker = async () => {
                while (poolIndex < failedIds.length) {
                    const id = failedIds[poolIndex++];
                    if (!id) break;
                    await new Promise(r => setTimeout(r, REQUEST_DELAY));
                    await processSingleNFT(id);
                }
            };

            const workers = Array(CONCURRENT_LIMIT).fill(null).map(() => queueWorker());
            await Promise.all(workers);

            isBatchRunning = false;
            updateBatchCounters();
        }

        async function downloadCurrentBatchAsZip() {
            downloadBatchBtn.disabled = true;
            downloadBatchBtn.textContent = 'Generating Package...';

            try {
                const zip = new JSZip();
                const folder = zip.folder(`batch_${currentBatchStart}_to_${currentBatchEnd}`);

                let virtualIndex = 1; 
                for (let i = currentBatchStart; i <= currentBatchEnd; i++) {
                    const item = nftDataStore[i];
                    if (item) {
                        const response = await fetch(item.dataURL);
                        const blob = await response.blob();
                        folder.file(`${virtualIndex}.png`, blob);
                    }
                    virtualIndex++;
                }

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                saveAs(zipBlob, `mfer_${currentBatchStart}_to_${currentBatchEnd}.zip`);
                downloadBatchBtn.textContent = '¼ Downloaded!';
                setTimeout(() => { downloadBatchBtn.textContent = 'Download Current Batch ZIP'; }, 2500);
            } catch (err) {
                alert("ZIP compression failure.");
            }
            downloadBatchBtn.disabled = false;
        }

        function openModal(tokenId) {
            activeModalTokenId = tokenId;
            const item = nftDataStore[tokenId];
            if (!item) return;

            modalTitle.textContent = `mfer #${tokenId}`;
            const ctx = modalCanvas.getContext('2d');
            const img = new Image();
            img.onload = () => { ctx.clearRect(0,0,512,512); ctx.drawImage(img,0,0,512,512); };
            img.src = item.dataURL;

            modalRetryArea.classList.toggle('show', item.isError);
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            activeModalTokenId = null;
        }

        singleRetryBtn.addEventListener('click', () => {
            if (activeModalTokenId) retrySingleItem(activeModalTokenId);
        });

        window.addEventListener('DOMContentLoaded', () => {
            initDropdown();
            changeBatch();
        });
    </script>
</body>
</html>
