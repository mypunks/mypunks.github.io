        }
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        .controls button, .controls label {
            background: #D8FF00;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            box-shadow: 0 0 20px #D8FF0044;
            margin: 5px;
            display: inline-block;
        }
        .controls button:hover, .controls label:hover {
            transform: scale(1.05);
            background: #fff;
            box-shadow: 0 0 40px #D8FF0088;
        }
        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .controls input[type="file"] {
            display: none;
        }
        .stats {
            text-align: center;
            color: #aaa;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .stats span {
            background: #222;
            padding: 4px 14px;
            border-radius: 30px;
            margin: 0 5px;
            border: 1px solid #D8FF0044;
        }
        .stats .highlight {
            color: #D8FF00;
            font-weight: bold;
        }
        .progress-container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background: #222;
            border-radius: 30px;
            overflow: hidden;
            height: 30px;
            border: 1px solid #D8FF0044;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #D8FF00, #aacc00);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 30px;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 20px auto;
        }
        .nft-card {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
            border: 2px solid #444;
            cursor: pointer;
        }
        .nft-card:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 35px rgba(216, 255, 0, 0.25);
            border-color: #D8FF00;
            z-index: 2;
        }
        .nft-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            background: #D8FF00;
        }
        .nft-card .token-id {
            color: #D8FF00;
            font-weight: bold;
            margin-top: 6px;
            font-size: 0.85rem;
            background: #1a1a1a;
            padding: 2px 10px;
            border-radius: 30px;
            display: inline-block;
            border: 1px solid #D8FF0033;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(6px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #1e1e1e;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 60px rgba(216, 255, 0, 0.25);
            border: 2px solid #D8FF00;
            max-width: 600px;
            width: 100%;
            position: relative;
        }
        .modal-content .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 2rem;
            color: #D8FF00;
            cursor: pointer;
            background: none;
            border: none;
            font-weight: bold;
            transition: transform 0.2s;
            line-height: 1;
        }
        .modal-content .close-btn:hover {
            transform: scale(1.3);
            color: #fff;
        }

            color: #D8FF00;
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 12px;
            font-weight: 600;
        }

            position: relative;
            width: 100%;
            max-width: 512px;
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            background: #D8FF00;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid #D8FF00;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3);

        .canvas-wrapper canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;

            left: 0;
            right: 0;

            color: #aaa;
            padding: 10px 20px;
            text-align: center;

            border-top: 1px solid #D8FF0044;
            z-index: 999;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }
        .status-bar span {
            background: #222;
            padding: 2px 14px;
            border-radius: 30px;
        }
        .status-bar .highlight {
            color: #D8FF00;
            font-weight: bold;
        }

            max-width: 800px;
            margin: 10px auto;
            background: #111;
            border-radius: 12px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #333;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #aaa;

        let nftData = [];

        // ============================================================
        //  হেল্পার ফাংশন
        // ============================================================
        function addLog(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-${type}`;
            div.textContent = message;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function updateProgress(current, total) {
            const percent = Math.round((current / total) * 100);
            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${percent}%`;
            speedIndicator.textContent = `📊 ${percent}%`;
        }

        function updateStats() {
            totalStats.textContent = totalItems;
            loadedStats.textContent = loaded;
            failedStats.textContent = failed;
            totalDisplay.textContent = totalItems;
        }

        // ============================================================
        //  ব্যাকগ্রাউন্ড রিপ্লেস (ক্যানভাসে)
        // ============================================================
        function replaceBackground(imageUrl) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = BG_COLOR;
                ctx.fillRect(0, 0, 512, 512);

                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = imageUrl;

                img.onload = function() {
                    const imgAspect = img.width / img.height;
                    let drawW, drawH, offsetX, offsetY;
                    if (imgAspect > 1) {
                        drawH = 512;
                        drawW = 512 * imgAspect;
                        offsetX = (512 - drawW) / 2;
                        offsetY = 0;
                    } else {
                        drawW = 512;
                        drawH = 512 / imgAspect;
                        offsetX = 0;
                        offsetY = (512 - drawH) / 2;
                    }
                    ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

                    const imageData = ctx.getImageData(0, 0, 512, 512);
                    const data = imageData.data;
                    const r = data[0];
                    const g = data[1];
                    const b = data[2];
                    const tolerance = 25;

                    for (let i = 0; i < data.length; i += 4) {
                        const pr = data[i];
                        const pg = data[i+1];
                        const pb = data[i+2];
                        if (Math.abs(pr - r) < tolerance && Math.abs(pg - g) < tolerance && Math.abs(pb - b) < tolerance) {
                            data[i] = 216;
                            data[i+1] = 255;
                            data[i+2] = 0;
                        }
                    }
                    ctx.putImageData(imageData, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                };

                img.onerror = function() {
                    ctx.fillStyle = BG_COLOR;
                    ctx.fillRect(0, 0, 512, 512);
                    ctx.fillStyle = '#00000088';
                    ctx.font = '20px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⚠️ Error', 256, 256);
                    resolve(canvas.toDataURL('image/png'));
                };
            });
        }

        // ============================================================
        //  NFT কার্ড তৈরি
        // ============================================================
        function createNFTCard(tokenId, dataURL) {
            const card = document.createElement('div');
            card.className = 'nft-card';
            card.dataset.tokenId = tokenId;

            const img = document.createElement('img');
            img.alt = `mfer #${tokenId}`;
            img.src = dataURL;
            img.loading = 'lazy';

            const idSpan = document.createElement('div');
            idSpan.className = 'token-id';
            idSpan.textContent = `#${tokenId}`;

            card.appendChild(img);
            card.appendChild(idSpan);

            card.addEventListener('click', function() {
                openModal(tokenId, dataURL);
            });

            return card;
        }

        // ============================================================
        //  মোডাল
        // ============================================================
        function openModal(tokenId, dataURL) {
            modalTitle.textContent = `#${tokenId}`;
            const canvas = modalCanvas;
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = function() {
                ctx.clearRect(0, 0, 512, 512);
                ctx.drawImage(img, 0, 0, 512, 512);
            };
            img.src = dataURL;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeModal();
        });

        // ============================================================
        //  লোড ফাংশন
        // ============================================================
        async function loadNFTs() {
            if (isRunning) return;
            if (nftData.length === 0) {
                alert('কোনো ডেটা নেই। প্রথমে CSV লোড করুন।');
                return;
            }

            isRunning = true;
            gallery.innerHTML = '';
            processedImages = [];
            loaded = 0;
            failed = 0;
            totalItems = nftData.length;
            downloadBtn.disabled = true;
            logContainer.innerHTML = '';
            addLog(`🚀 ${totalItems} টি NFT লোড শুরু...`, 'info');

            const batchSize = CONCURRENT_LIMIT;
            let processed = 0;

            for (let start = 0; start < totalItems; start += batchSize) {
                const end = Math.min(start + batchSize, totalItems);
                const batch = nftData.slice(start, end);

                const promises = batch.map(async ([tokenId, cid]) => {
                    const imageUrl = `${GATEWAY}/${cid}`;
                    const dataURL = await replaceBackground(imageUrl);
                    const card = createNFTCard(tokenId, dataURL);

                    // সফল বলে ধরে নিচ্ছি (কারণ CID ভ্যালিড)
                    loaded++;
                    processedImages.push({ tokenId, dataURL });

                    return card;
                });

                const cards = await Promise.all(promises);
                const fragment = document.createDocumentFragment();
                for (const card of cards) {
                    fragment.appendChild(card);
                }
                gallery.appendChild(fragment);

                processed += batch.length;
                updateProgress(processed, totalItems);
                updateStats();
                statusMsg.textContent = `লোড: ${processed}/${totalItems}`;

                await new Promise(r => setTimeout(r, 20));
            }

            addLog(`✅ সম্পন্ন! লোড: ${loaded}, ফেইল: ${failed}`, 'success');
            statusMsg.textContent = `✅ সম্পন্ন! ${loaded} টি লোড হয়েছে`;
            downloadBtn.disabled = false;
            isRunning = false;
        }

        // ============================================================
        //  জিপ ডাউনলোড
        // ============================================================
        async function downloadAllAsZip() {
            if (processedImages.length === 0) {
                alert('কোনো ছবি প্রসেস হয়নি। প্রথমে লোড করুন।');
                return;
            }

            downloadBtn.disabled = true;
            downloadBtn.textContent = '⏳ জিপ তৈরি হচ্ছে...';

            try {
                const zip = new JSZip();
                const folder = zip.folder('mfer_bg_replaced');

                const batchSize = 100;
                for (let i = 0; i < processedImages.length; i += batchSize) {
                    const batch = processedImages.slice(i, i + batchSize);
                    const blobPromises = batch.map(async (item) => {
                        const response = await fetch(item.dataURL);
                        const blob = await response.blob();
                        return { tokenId: item.tokenId, blob };
                    });

                    const blobResults = await Promise.all(blobPromises);
                    for (const result of blobResults) {
                        folder.file(`${result.tokenId}.png`, result.blob);
                    }

                    const progress = Math.min(i + batchSize, processedImages.length);
                    downloadBtn.textContent = `⏳ ${progress}/${processedImages.length}`;
                }

                const zipBlob = await zip.generateAsync({ type: 'blob' });
                saveAs(zipBlob, 'mfer_10000_bg_replaced.zip');
                downloadBtn.textContent = '✅ ডাউনলোড সম্পূর্ণ!';
                setTimeout(() => {
                    downloadBtn.textContent = '📦 জিপ ডাউনলোড';
                }, 3000);
            } catch (error) {
                console.error('জিপ তৈরি ব্যর্থ:', error);
                alert('জিপ তৈরি করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
            }

            downloadBtn.disabled = false;
            downloadBtn.textContent = '📦 জিপ ডাউনলোড';
        }

        // ============================================================
        //  CSV হ্যান্ডলিং
        // ============================================================
        function loadFromCSV() {
            nftData = defaultCsvData;
            logContainer.innerHTML = '';
            addLog(`📄 ডিফল্ট CSV লোড: ${nftData.length} টি NFT`, 'info');
            totalDisplay.textContent = nftData.length;
            totalStats.textContent = nftData.length;
            statusMsg.textContent = `${nftData.length} টি NFT প্রস্তুত`;
            loadNFTs();
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n');
                const data = [];

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (line) {
                        const parts = line.split(',');
                        if (parts.length >= 2) {
                            const tokenId = parseInt(parts[0]);
                            const cid = parts[1].trim();
                            if (!isNaN(tokenId) && cid) {
                                data.push([tokenId, cid]);
                            }
                        }
                    }
                }

                if (data.length === 0) {
                    alert('CSV থেকে কোনো ডেটা পাওয়া যায়নি। ফরম্যাট: Token_ID,CID');
                    return;
                }

                nftData = data;
                logContainer.innerHTML = '';
                addLog(`📄 CSV আপলোড: ${nftData.length} টি NFT`, 'info');
                totalDisplay.textContent = nftData.length;
                totalStats.textContent = nftData.length;
                statusMsg.textContent = `${nftData.length} টি NFT প্রস্তুত`;
                loadNFTs();
            };
            reader.readAsText(file);
        }

        // ============================================================
        //  পেজ লোড
        // ============================================================
        window.addEventListener('DOMContentLoaded', () => {
            // ডিফল্ট ডেটা লোড
            nftData = defaultCsvData;

            totalStats.textContent = nftData.length;
            statusMsg.textContent = `${nftData.length} টি NFT প্রস্তুত`;
            addLog(`📄 ডিফল্ট CSV লোড: ${nftData.length} টি NFT`, 'info');
            addLog('💡 "ডিফল্ট CSV লোড" ক্লিক করলে লোড শুরু হবে', 'info');
        });
