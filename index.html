<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mfer · Direct CID Layer Pipeline</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg: #0a0a0b;
            --bg-elevated: #131315;
            --card: #17171a;
            --card-border: #26262a;
            --lime: #D8FF00;
            --lime-dim: #D8FF0022;
            --text: #f2f2ef;
            --text-dim: #8f8f94;
            --error: #ff5470;
            --error-dim: #ff547022;
            --radius-lg: 20px;
            --radius-md: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse 1200px 700px at 50% -10%, #1c1f0c 0%, var(--bg) 55%), var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            padding: 48px 24px 96px;
            min-height: 100vh;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .brand .swatch {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            background: var(--lime);
            box-shadow: 0 0 18px var(--lime-dim), 0 0 4px var(--lime);
            margin-bottom: 18px;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            letter-spacing: -0.02em;
            text-align: center;
            color: var(--text);
        }
        h1 .hash { color: var(--lime); }

        .sub {
            text-align: center;
            color: var(--text-dim);
            margin-top: 10px;
            font-size: 0.95rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--card-border);
            max-width: 800px;
            margin: 0 auto 32px;
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: var(--bg-elevated);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: var(--radius-md);
            text-align: center;
        }
        .stat-box .label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 6px;
        }
        .stat-box .val {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
        }
        .stat-box.lime-status .val { color: var(--lime); }
        .stat-box.error-status .val { color: var(--error); }

        .controls-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            border: none;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.18s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: var(--lime); color: #0a0a0b; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px #D8FF0044; }
        .btn-secondary { background: var(--bg-elevated); color: var(--text); border: 1px solid var(--card-border); }
        .btn-secondary:hover:not(:disabled) { border-color: var(--text-dim); }
        .btn-danger { background: rgba(255, 84, 112, 0.15); color: var(--error); border: 1px solid var(--error); }
        .btn-danger:hover:not(:disabled) { background: var(--error); color: #fff; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .file-upload-btn {
            position: relative;
            overflow: hidden;
            background: #1c1f0c;
            border-color: var(--lime);
            color: var(--lime);
        }
        .file-upload-btn input[type="file"] {
            position: absolute;
            top: 0; left: 0; opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }

        .logger-area {
            background: #060607;
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            height: 220px;
            overflow-y: auto;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.6;
        }
        .log-entry { margin-bottom: 4px; display: flex; justify-content: space-between;}
        .log-success { color: var(--lime); }
        .log-error { color: var(--error); }
        .log-info { color: #54b2ff; }

    </style>
</head>
<body>

    <div class="brand">
        <div class="swatch"></div>
        <h1>mfer <span class="hash">· Direct CID Pipeline</span></h1>
        <p class="sub">High-Speed Image Injection via Mapping CSV</p>
    </div>

    <div class="panel">
        <div class="stats-grid">
            <div class="stat-box">
                <div class="label">CSV Loaded Items</div>
                <div class="val" id="statTarget">0</div>
            </div>
            <div class="stat-box">
                <div class="label">Processed</div>
                <div class="val" id="statProcessed">0</div>
            </div>
            <div class="stat-box lime-status">
                <div class="label">Fixed Success</div>
                <div class="val" id="statSuccess">0</div>
            </div>
            <div class="stat-box error-status">
                <div class="label">Failed</div>
                <div class="val" id="statFailed">0</div>
            </div>
        </div>

        <div class="controls-row" style="margin-bottom: 20px;">
            <div class="btn btn-secondary file-upload-btn" id="uploadWrapper">
                📁 Step 1: Upload Token & CID CSV
                <input type="file" id="csvFileInput" accept=".csv" onchange="handleMappingCSVUpload(event)" />
            </div>
            <button class="btn btn-primary" id="startBtn" onclick="startCidPipeline()" disabled>▶️ Step 2: Start Rendering from CID</button>
            <button class="btn btn-secondary" id="downloadZipBtn" onclick="downloadZipArchive()" disabled>📦 Step 3: Download Custom ZIP</button>
        </div>

        <div class="logger-area" id="logger">
            <div style="color: var(--lime);">[System] Standby. Please upload the 'token_id_cid.csv' to ignite the pipeline.</div>
        </div>
    </div>

    <script>
        const CONCURRENT_LIMIT = 5; 
        const REQUEST_DELAY = 150; 
        const BG_COLOR = '#D8FF00';
        const MAX_GATEWAY_RETRIES = 4;

        // Blazing fast direct gateways
        const IMAGE_GATEWAYS = [
            'https://cloudflare-ipfs.com/ipfs',
            'https://ipfs.io/ipfs',
            'https://gateway.pinata.cloud/ipfs',
            'https://dweb.link/ipfs'
        ];

        let pipelineQueue = []; // Holds objects: { tokenId: num, cid: string }
        let completedDataMap = new Map(); // Maps tokenId -> dataURL
        let currentFailedList = []; // Holds objects: { tokenId: num, cid: string }
        
        let isPipelineRunning = false;
        let currentQueueIndex = 0;

        const statTarget = document.getElementById('statTarget');
        const statProcessed = document.getElementById('statProcessed');
        const statSuccess = document.getElementById('statSuccess');
        const statFailed = document.getElementById('statFailed');
        const logger = document.getElementById('logger');
        
        const startBtn = document.getElementById('startBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const csvFileInput = document.getElementById('csvFileInput');

        function logToConsole(message, type = '') {
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            div.innerHTML = `<span>[${time}] ${message}</span>`;
            logger.appendChild(div);
            logger.scrollTop = logger.scrollHeight;
        }

        // Native Bypass Core Loader Engine
        async function fetchImageDirectlyFromCid(tokenId, cid, attempt = 0) {
            const currentGateway = IMAGE_GATEWAYS[attempt % IMAGE_GATEWAYS.length];
            const gatewayUrl = `${currentGateway}/${cid}`;
            
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                
                const timeoutId = setTimeout(() => {
                    img.src = ""; 
                    handleFail();
                }, 9000);

                async function handleFail() {
                    clearTimeout(timeoutId);
                    if (attempt < MAX_GATEWAY_RETRIES) {
                        logToConsole(`🔄 Routing to Next Gateway for token #${tokenId}...`, 'log-info');
                        const retryRes = await fetchImageDirectlyFromCid(tokenId, cid, attempt + 1);
                        resolve(retryRes);
                    } else {
                        resolve({ success: false });
                    }
                }

                img.onload = function() {
                    clearTimeout(timeoutId);
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = 512; canvas.height = 512;
                        const ctx = canvas.getContext('2d');
                        
                        ctx.fillStyle = BG_COLOR; 
                        ctx.fillRect(0, 0, 512, 512);

                        const imgAspect = img.width / img.height;
                        let drawW = 512, drawH = 512, offsetX = 0, offsetY = 0;
                        if (imgAspect > 1) {
                            drawH = 512; drawW = 512 * imgAspect; offsetX = (512 - drawW) / 2;
                        } else {
                            drawW = 512; drawH = 512 / imgAspect; offsetY = (512 - drawH) / 2;
                        }
                        
                        const processCanvas = document.createElement('canvas');
                        processCanvas.width = 512; processCanvas.height = 512;
                        const pCtx = processCanvas.getContext('2d');
                        pCtx.drawImage(img, offsetX, offsetY, drawW, drawH);

                        const imageData = pCtx.getImageData(0, 0, 512, 512);
                        const data = imageData.data;
                        
                        const rTarget = data[0];
                        const gTarget = data[1];
                        const bTarget = data[2];

                        for (let j = 0; j < data.length; j += 4) {
                            if (Math.abs(data[j] - rTarget) < 30 && Math.abs(data[j+1] - gTarget) < 30 && Math.abs(data[j+2] - bTarget) < 30) {
                                data[j] = 216;     
                                data[j+1] = 255;   
                                data[j+2] = 0;     
                            }
                        }
                        pCtx.putImageData(imageData, 0, 0);
                        ctx.drawImage(processCanvas, 0, 0);
                        resolve({ success: true, dataURL: canvas.toDataURL('image/png') });
                    } catch (e) {
                        handleFail();
                    }
                };

                img.onerror = () => handleFail();
                img.src = gatewayUrl;
            });
        }

        async function processItem(item) {
            const result = await fetchImageDirectlyFromCid(item.tokenId, item.cid);

            if (result.success && result.dataURL) {
                completedDataMap.set(item.tokenId, result.dataURL);
                logToConsole(`⚡ Success: mfer #${item.tokenId} rendered perfectly.`, 'log-success');
            } else {
                if (!currentFailedList.some(f => f.tokenId === item.tokenId)) {
                    currentFailedList.push(item);
                }
                logToConsole(`❌ Error: Unable to fetch assets for token #${item.tokenId}.`, 'log-error');
            }

            statProcessed.textContent = completedDataMap.size + currentFailedList.length;
            statSuccess.textContent = completedDataMap.size;
            statFailed.textContent = currentFailedList.length;
        }

        async function startCidPipeline() {
            if (isPipelineRunning || pipelineQueue.length === 0) return;
            isPipelineRunning = true;

            startBtn.disabled = true;
            downloadZipBtn.disabled = true;
            csvFileInput.disabled = true;

            logToConsole(`Ignited direct CID processing pipeline for ${pipelineQueue.length} assets...`, 'log-success');

            const worker = async () => {
                while (currentQueueIndex < pipelineQueue.length) {
                    const item = pipelineQueue[currentQueueIndex++];
                    
                    if (completedDataMap.has(item.tokenId)) continue;

                    await processItem(item);
                    await new Promise(r => setTimeout(r, REQUEST_DELAY));
                }
            };

            const pool = Array(CONCURRENT_LIMIT).fill(null).map(() => worker());
            await Promise.all(pool);

            isPipelineRunning = false;
            startBtn.disabled = false;
            downloadZipBtn.disabled = completedDataMap.size === 0;
            csvFileInput.disabled = false;

            logToConsole(`Pipeline Run Completed! Rendered successfully: ${completedDataMap.size} items. Ready to zip.`, 'log-success');
            
            if(currentFailedList.length > 0) {
                triggerRemainingCsvDownload();
            }
        }

        function triggerRemainingCsvDownload() {
            let csvContent = "data:text/csv;charset=utf-8,Token_ID,CID,Status\n" + 
                currentFailedList.map(e => `${e.tokenId},${e.cid},Failed`).join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "still_failed_tokens.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function handleMappingCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r?\n/);
                const loadedItems = [];

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    
                    const columns = line.split(',');
                    if(columns.length >= 2) {
                        const tId = parseInt(columns[0].trim());
                        const cidStr = columns[1].trim();
                        
                        if (!isNaN(tId) && cidStr.length > 10) {
                            loadedItems.push({ tokenId: tId, cid: cidStr });
                        }
                    }
                }

                if (loadedItems.length > 0) {
                    pipelineQueue = loadedItems;
                    currentQueueIndex = 0;
                    currentFailedList = []; 
                    completedDataMap.clear(); 

                    statTarget.textContent = pipelineQueue.length;
                    statProcessed.textContent = "0";
                    statSuccess.textContent = "0";
                    statFailed.textContent = "0";

                    startBtn.disabled = false;
                    logToConsole(`Mapping CSV Accepted! Found ${loadedItems.length} matching rules. Ready to generate!`, 'log-success');
                } else {
                    alert("Invalid CSV format. Please ensure Token_ID and CID columns exist.");
                }
            };
            reader.readAsText(file);
        }

        async function downloadZipArchive() {
            downloadZipBtn.disabled = true;
            const originalText = downloadZipBtn.textContent;
            downloadZipBtn.textContent = '📦 Assembling ZIP...';

            try {
                const zip = new JSZip();
                const folder = zip.folder("mfer_fixed_cid_images");

                for (const [id, dataURL] of completedDataMap.entries()) {
                    const res = await fetch(dataURL);
                    const blob = await res.blob();
                    
                    // Saves output image with exact original Token ID naming convention
                    folder.file(`${id}.png`, blob);
                }

                const content = await zip.generateAsync({ type: "blob" });
                saveAs(content, "mfer_cid_mapped_lime_batch.zip");
                logToConsole("Targeted ZIP matching original scheme downloaded successfully!", 'log-success');
            } catch (e) {
                alert("Error packing target zip.");
            }

            downloadZipBtn.textContent = originalText;
            downloadZipBtn.disabled = false;
        }
    </script>
</body>
</html>
